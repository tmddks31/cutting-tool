<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>매트 컷팅 도구 v1.3</title>
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0f0f;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;}
input:focus{outline:2px solid #3b82f6!important;}
@media print{.no-print{display:none!important;}body{background:#fff;color:#000;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

// ═══════════════════════════════════════════════════════
// ▓ CORE LAYER ▓  순수 로직 — RN 전환 시 100% 재사용
// ═══════════════════════════════════════════════════════
const Geo={
  dist:(a,b)=>Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2),
  uid:()=>Math.random().toString(36).slice(2,8),
  calcArea:pts=>{
    if(pts.length<3)return 0;
    let a=0;
    for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}
    return Math.abs(a/2);
  },
};
const HomographyEngine={
  _solve:(A,b)=>{
    const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
    for(let c=0;c<n;c++){
      let mx=c;
      for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[mx][c]))mx=r;
      [M[c],M[mx]]=[M[mx],M[c]];
      for(let r=c+1;r<n;r++){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}
    }
    const x=new Array(n).fill(0);
    for(let i=n-1;i>=0;i--){x[i]=M[i][n];for(let j=i+1;j<n;j++)x[i]-=M[i][j]*x[j];x[i]/=M[i][i];}
    return x;
  },
  compute:(src,dst)=>{
    const A=[],b=[];
    for(let i=0;i<4;i++){
      const{x:sx,y:sy}=src[i],{x:dx,y:dy}=dst[i];
      A.push([sx,sy,1,0,0,0,-sx*dx,-sy*dx]);b.push(dx);
      A.push([0,0,0,sx,sy,1,-sx*dy,-sy*dy]);b.push(dy);
    }
    return[...HomographyEngine._solve(A,b),1];
  },
  apply:(H,{x,y})=>{const w=H[6]*x+H[7]*y+H[8];return{x:(H[0]*x+H[1]*y+H[2])/w,y:(H[3]*x+H[4]*y+H[5])/w};},
};
const Measure={
  toMm:(pt,cal)=>{
    if(!cal)return pt;
    if(cal.mode==='line')return{x:pt.x*cal.mmPerPx,y:pt.y*cal.mmPerPx};
    return HomographyEngine.apply(cal.H,pt);
  },
  mmDist:(a,b,cal)=>cal?Geo.dist(Measure.toMm(a,cal),Measure.toMm(b,cal)):null,
  mmArea:(pts,cal)=>(!cal||pts.length<3)?null:Geo.calcArea(pts.map(p=>Measure.toMm(p,cal))),
};
const ExportCore={
  toSVG:(pieces,cal)=>{
    if(!cal)return null;
    const all=pieces.flatMap(p=>p.pts.map(pt=>Measure.toMm(pt,cal)));
    if(!all.length)return null;
    const pad=15,minX=Math.min(...all.map(p=>p.x))-pad,minY=Math.min(...all.map(p=>p.y))-pad;
    const W=Math.max(...all.map(p=>p.x))+pad-minX,H=Math.max(...all.map(p=>p.y))+pad-minY;
    let body='';
    pieces.forEach((piece,pi)=>{
      if(piece.pts.length<2)return;
      const color=CUT_COLORS[pi%CUT_COLORS.length];
      const mp=piece.pts.map(pt=>Measure.toMm(pt,cal));
      body+=`<path d="M ${mp.map(p=>`${(p.x-minX).toFixed(2)},${(p.y-minY).toFixed(2)}`).join(' L ')}${piece.closed?' Z':''}" fill="${piece.closed?color+'22':'none'}" stroke="${color}" stroke-width="0.5" stroke-linejoin="round"/>\n`;
      const ep=piece.closed?[...mp,mp[0]]:mp;
      for(let i=1;i<ep.length;i++){
        const mm=Geo.dist(ep[i-1],ep[i]);
        body+=`<text x="${((ep[i-1].x+ep[i].x)/2-minX).toFixed(1)}" y="${((ep[i-1].y+ep[i].y)/2-minY-1.5).toFixed(1)}" font-size="3" fill="${color}" text-anchor="middle">${mm.toFixed(0)}mm</text>\n`;
      }
    });
    return`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(1)}mm" height="${H.toFixed(1)}mm" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}">\n${body}</svg>`;
  },
};

// ═══════════════════════════════════════════════════════
// ▓ SERVICE LAYER ▓  RN 전환 시 구현체만 교체
// ═══════════════════════════════════════════════════════
const StorageService={
  save:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;}},
  load:(k)=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch{return null;}},
};
const VisionAIService={
  detectArea:async(base64,mime,apiKey)=>{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1024,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:base64}},
          {type:'text',text:`이미지에서 바닥에 매트를 깔 수 있는 공간의 외곽 폴리곤을 감지해주세요.\n반드시 아래 JSON 형식으로만 응답하세요:\n{"polygons":[{"name":"영역 이름","points":[{"x":0.1,"y":0.2},...]}]}\n좌표는 이미지 크기 대비 비율(0.0~1.0). 최대 3개 영역, 각 3~8개 점.`},
        ]}],
      }),
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`API ${res.status}`);}
    const data=await res.json();
    const txt=data.content.find(c=>c.type==='text')?.text||'';
    return JSON.parse(txt.replace(/```json|```/g,'').trim());
  },
};

// ═══════════════════════════════════════════════════════
// ▓ UI LAYER ▓  웹 전용 — RN 전환 시 재작성
// ═══════════════════════════════════════════════════════
const CUT_COLORS=['#ef4444','#f59e0b','#22c55e','#a855f7','#06b6d4','#ec4899'];
const C={bg:'#0f0f0f',surf:'#181818',card:'#222',border:'#2c2c2c',
  accent:'#3b82f6',accentDim:'#1e3a5f',accentTxt:'#60a5fa',
  success:'#22c55e',warn:'#f59e0b',danger:'#ef4444',txt:'#f0f0f0',muted:'#666',faint:'#2a2a2a'};
const HOMO_LABELS=['↖ 왼쪽 위','↗ 오른쪽 위','↘ 오른쪽 아래','↙ 왼쪽 아래'];
const HOMO_COLORS=['#ef4444','#f59e0b','#22c55e','#a855f7'];
const DEFAULT_ADMIN={unit:'mm',defaultTileSize:60,closeSensitivity:44,
  presets:[{id:'a',label:'문폭',value:900},{id:'b',label:'문틀',value:800},{id:'c',label:'창문',value:600},{id:'d',label:'타일',value:300},{id:'e',label:'1m',value:1000},{id:'f',label:'2m',value:2000}]};

const Btn=p=><button {...p} style={{padding:'14px',borderRadius:12,border:'none',background:C.accent,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer',width:'100%',...p.style}}>{p.children}</button>;
const BtnS=p=><button {...p} style={{padding:'10px 18px',borderRadius:10,border:`2px solid ${C.border}`,background:C.card,color:'#ccc',fontSize:14,cursor:'pointer',...p.style}}>{p.children}</button>;
const BtnG=p=><button {...p} style={{padding:'6px 12px',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.muted,fontSize:13,cursor:'pointer',...p.style}}>{p.children}</button>;

function App(){
  const [step,setStep]=useState(1);
  const [prodType,setProdType]=useState('puzzle');
  // tileSize는 admin 기본값에서 초기화
  const [tileSize,setTileSize]=useState(()=>(StorageService.load('adminSettings')||DEFAULT_ADMIN).defaultTileSize);

  // 보정 상태
  const [calibMode,setCalibMode]=useState('line');
  const [scalePts,setScalePts]=useState([]);
  const [scaleMm,setScaleMm]=useState('');
  const [homoPts,setHomoPts]=useState([]);
  const [homoW,setHomoW]=useState('');
  const [homoH,setHomoH]=useState('');
  const [calib,setCalib]=useState(null);

  // 영역
  const [pieces,setPieces]=useState([]);
  const [activeId,setActiveId]=useState(null);
  const [hoverPt,setHoverPt]=useState(null);
  const [dragging,setDragging]=useState(null);
  const [img,setImg]=useState(null);

  // UI
  const [toast,setToast]=useState(null);
  const [zoom,setZoom]=useState(1);
  const [panX,setPanX]=useState(0);
  const [panY,setPanY]=useState(0);
  const [showSettings,setShowSettings]=useState(false);
  const [settingsTab,setSettingsTab]=useState('api'); // 'api' | 'admin'
  const [aiLoading,setAiLoading]=useState(false);

  // API 키
  const [apiKey,setApiKey]=useState(()=>StorageService.load('apiKey')||'');

  // ▼ 관리자 설정
  const [admin,setAdmin]=useState(()=>({...DEFAULT_ADMIN,...(StorageService.load('adminSettings')||{})}));
  const saveAdmin=(updates)=>{const n={...admin,...updates};setAdmin(n);StorageService.save('adminSettings',n);};
  // 단위 표시 헬퍼
  const fmtLen=useCallback((mm)=>{
    if(mm===null||mm===undefined)return'-';
    return admin.unit==='cm'?`${(mm/10).toFixed(1)} cm`:`${Math.round(mm)} mm`;
  },[admin.unit]);
  const fmtArea=useCallback((mm2)=>{
    if(mm2===null||mm2===undefined)return'-';
    return admin.unit==='cm'?`${(mm2/100).toFixed(1)} cm²`:`${(mm2/1e6).toFixed(3)} m²`;
  },[admin.unit]);

  const canvasRef=useRef(null);
  const imgElRef=useRef(null);
  const fileRef=useRef(null);
  const touchRef=useRef({type:null});

  const CLOSE_PX=admin.closeSensitivity||44;
  const DRAG_PX=44;

  const showToast=(msg,dur=2400)=>{setToast(msg);setTimeout(()=>setToast(null),dur);};
  const resetView=()=>{setZoom(1);setPanX(0);setPanY(0);};

  const s2c=useCallback((sx,sy)=>{
    const c=canvasRef.current;if(!c||!img)return{x:0,y:0};
    const r=c.getBoundingClientRect();
    return{x:(sx-r.left)*(img.w/r.width),y:(sy-r.top)*(img.h/r.height)};
  },[img]);
  const screenDist=useCallback((a,b)=>{
    const c=canvasRef.current;if(!c||!img)return 9999;
    return Geo.dist(a,b)*(c.getBoundingClientRect().width/img.w);
  },[img]);
  const evtPos=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};

  const onFile=e=>{
    const f=e.target.files[0];if(!f)return;
    const url=URL.createObjectURL(f);
    const im=new Image();
    im.onload=()=>{
      imgElRef.current=im;
      setImg({src:url,w:im.naturalWidth,h:im.naturalHeight});
      setScalePts([]);setScaleMm('');setHomoPts([]);setHomoW('');setHomoH('');
      setCalib(null);setPieces([]);setActiveId(null);resetView();setStep(3);
    };
    im.src=url;
  };
  const initPieces=()=>{const id=Geo.uid();setPieces([{id,name:'영역 1',pts:[],closed:false}]);setActiveId(id);};
  const confirmLine=()=>{
    if(scalePts.length!==2||!scaleMm||+scaleMm<=0)return showToast('끝점과 길이를 모두 입력하세요');
    setCalib({mode:'line',mmPerPx:+scaleMm/Geo.dist(scalePts[0],scalePts[1])});
    initPieces();setStep(4);showToast('기준선 설정 완료 ✓');
  };
  const confirmHomo=()=>{
    if(homoPts.length!==4||!homoW||!homoH||+homoW<=0||+homoH<=0)return showToast('4개 코너와 크기를 모두 입력하세요');
    const W=+homoW,H=+homoH;
    setCalib({mode:'homography',H:HomographyEngine.compute(homoPts,[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}])});
    initPieces();setStep(4);showToast('4점 원근 보정 완료 ✓');
  };

  const runAIDetect=async()=>{
    if(!apiKey)return showToast('⚙️ 설정에서 API 키를 입력해주세요',3500);
    if(!img||!imgElRef.current)return;
    setAiLoading(true);
    try{
      const tmp=document.createElement('canvas');
      tmp.width=img.w;tmp.height=img.h;
      tmp.getContext('2d').drawImage(imgElRef.current,0,0);
      const b64=tmp.toDataURL('image/jpeg',0.8).split(',')[1];
      const result=await VisionAIService.detectArea(b64,'image/jpeg',apiKey);
      if(!result.polygons?.length)return showToast('감지된 영역이 없어요');
      const np=result.polygons.map((poly,i)=>({
        id:Geo.uid(),name:poly.name||`AI 영역 ${i+1}`,
        pts:poly.points.map(p=>({x:p.x*img.w,y:p.y*img.h})),
        closed:true,fromAI:true,
      }));
      setPieces(p=>[...p.filter(x=>x.pts.length>0),...np]);
      setActiveId(np[0].id);
      showToast(`✨ ${np.length}개 영역 자동 감지 완료`);
    }catch(e){showToast(`AI 오류: ${e.message}`,4000);}
    finally{setAiLoading(false);}
  };

  // 캔버스 그리기
  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas||!img||!imgElRef.current)return;
    if(canvas.width!==img.w||canvas.height!==img.h){canvas.width=img.w;canvas.height=img.h;}
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,img.w,img.h);ctx.drawImage(imgElRef.current,0,0);
    const bs=Math.max(img.w,img.h)*0.014;

    // 기준선
    if(step===3&&calibMode==='line'&&scalePts.length>0){
      const ep=scalePts[1]||hoverPt;
      ctx.strokeStyle='#60a5fa';ctx.lineWidth=bs*0.4;ctx.setLineDash([bs,bs*0.5]);
      ctx.beginPath();ctx.moveTo(scalePts[0].x,scalePts[0].y);if(ep)ctx.lineTo(ep.x,ep.y);
      ctx.stroke();ctx.setLineDash([]);
      scalePts.forEach(p=>{ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.arc(p.x,p.y,bs*1.2,0,Math.PI*2);ctx.fill();});
    }
    // 4점 원근
    if(step===3&&calibMode==='homography'){
      if(homoPts.length>=2){
        ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=bs*0.3;ctx.setLineDash([bs,bs*0.5]);
        ctx.beginPath();homoPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
        if(homoPts.length===4)ctx.closePath();ctx.stroke();ctx.setLineDash([]);
      }
      homoPts.forEach((p,i)=>{
        ctx.fillStyle=HOMO_COLORS[i];ctx.beginPath();ctx.arc(p.x,p.y,bs*1.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font=`bold ${bs*1.3}px Arial`;
        ctx.fillText(['TL','TR','BR','BL'][i],p.x+bs*2,p.y-bs*0.5);
      });
      if(homoPts.length<4&&hoverPt){
        ctx.fillStyle=HOMO_COLORS[homoPts.length]+'77';ctx.beginPath();
        ctx.arc(hoverPt.x,hoverPt.y,bs*1.2,0,Math.PI*2);ctx.fill();
      }
    }

    // 컷팅 영역
    const ap=pieces.find(p=>p.id===activeId);
    const nearClose=ap&&!ap.closed&&ap.pts.length>=3&&hoverPt&&screenDist(ap.pts[0],hoverPt)<CLOSE_PX;

    pieces.forEach((piece,pi)=>{
      if(!piece.pts.length)return;
      const color=CUT_COLORS[pi%CUT_COLORS.length];
      const isActive=piece.id===activeId;
      if(piece.closed){
        ctx.fillStyle=color+'28';ctx.beginPath();
        piece.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
        ctx.closePath();ctx.fill();
      }
      ctx.strokeStyle=color;ctx.lineWidth=isActive?bs*0.6:bs*0.3;ctx.lineJoin='round';
      ctx.beginPath();
      piece.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      if(piece.closed)ctx.closePath();
      else if(isActive&&hoverPt&&step===4){
        // ▼ BUG FIX: nearClose일 때 첫 점으로 스냅 (이전: 커서 위치로 선이 튀는 버그)
        const snap=isActive&&nearClose;
        ctx.lineTo(snap?piece.pts[0].x:hoverPt.x,snap?piece.pts[0].y:hoverPt.y);
      }
      ctx.stroke();

      piece.pts.forEach((p,i)=>{
        const isFirst=i===0;
        if(isFirst&&isActive&&nearClose){
          ctx.strokeStyle='#22c55e';ctx.lineWidth=bs*0.7;
          ctx.beginPath();ctx.arc(p.x,p.y,bs*2.8,0,Math.PI*2);ctx.stroke();
          ctx.fillStyle='#22c55e';ctx.font=`bold ${bs*1.4}px Arial`;ctx.textAlign='center';
          ctx.fillText('탭하면 완성!',p.x,p.y-bs*3.5);ctx.textAlign='left';
        }
        ctx.beginPath();ctx.arc(p.x,p.y,isFirst?bs*1.6:bs*1.1,0,Math.PI*2);
        ctx.fillStyle=isFirst?'#fff':color;ctx.fill();
        if(isFirst){ctx.strokeStyle=nearClose&&isActive?'#22c55e':color;ctx.lineWidth=bs*0.5;ctx.stroke();}
      });
      if(piece.fromAI&&piece.pts.length>0){
        const cx=piece.pts.reduce((s,p)=>s+p.x,0)/piece.pts.length;
        const cy=piece.pts.reduce((s,p)=>s+p.y,0)/piece.pts.length;
        ctx.font=`bold ${bs*1.2}px Arial`;ctx.textAlign='center';
        ctx.fillStyle='rgba(0,0,0,0.65)';const tw=ctx.measureText('✨ AI').width;
        ctx.fillRect(cx-tw/2-6,cy-bs*2,tw+12,bs*2.4);ctx.fillStyle='#60a5fa';ctx.fillText('✨ AI',cx,cy);ctx.textAlign='left';
      }
      if(calib){
        ctx.textAlign='center';ctx.font=`bold ${bs*1.5}px Arial`;
        const ep=piece.closed?[...piece.pts,piece.pts[0]]:piece.pts;
        for(let i=1;i<ep.length;i++){
          const mm=Measure.mmDist(ep[i-1],ep[i],calib);if(mm===null)continue;
          const mx=(ep[i-1].x+ep[i].x)/2,my=(ep[i-1].y+ep[i].y)/2;
          const txt=fmtLen(mm);const tw=ctx.measureText(txt).width;
          ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(mx-tw/2-5,my-bs*2,tw+10,bs*2.2);
          ctx.fillStyle='#fff';ctx.fillText(txt,mx,my-bs*0.3);
        }
        ctx.textAlign='left';
        if(piece.closed){
          const cx=piece.pts.reduce((s,p)=>s+p.x,0)/piece.pts.length;
          const cy=piece.pts.reduce((s,p)=>s+p.y,0)/piece.pts.length;
          const a2=Measure.mmArea(piece.pts,calib);
          if(a2!==null){
            const txt=fmtArea(a2);ctx.font=`bold ${bs*1.8}px Arial`;ctx.textAlign='center';
            const tw=ctx.measureText(txt).width;
            ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(cx-tw/2-8,cy-bs*2.2,tw+16,bs*2.6);
            ctx.fillStyle=color;ctx.fillText(txt,cx,cy);ctx.textAlign='left';
          }
        }
      }
    });
    if(hoverPt&&(step===3||step===4)&&!nearClose){
      ctx.fillStyle='rgba(255,255,255,0.45)';ctx.beginPath();ctx.arc(hoverPt.x,hoverPt.y,bs*0.55,0,Math.PI*2);ctx.fill();
    }
  },[img,scalePts,homoPts,calib,calibMode,pieces,hoverPt,step,activeId,screenDist,fmtLen,fmtArea,CLOSE_PX]);

  // 포인터 이벤트
  const onDown=e=>{
    e.preventDefault();
    const{x:sx,y:sy}=evtPos(e);const cp=s2c(sx,sy);
    if(step===3){
      if(calibMode==='line'){if(scalePts.length<2)setScalePts(p=>[...p,{...cp}]);}
      else{if(homoPts.length<4)setHomoPts(p=>[...p,{...cp}]);}
      return;
    }
    if(step===4){
      const ap=pieces.find(p=>p.id===activeId);if(!ap)return;
      // ▼ BUG FIX: 닫기 감지를 드래그 감지보다 먼저 처리
      // (이전: 첫 점이 드래그로 잡혀서 위치가 변경되는 버그)
      if(!ap.closed&&ap.pts.length>=3&&screenDist(ap.pts[0],cp)<CLOSE_PX){
        setPieces(p=>p.map(x=>x.id===activeId?{...x,closed:true}:x));
        showToast('✅ 도형 완성!');return;
      }
      for(let i=0;i<ap.pts.length;i++){
        if(screenDist(ap.pts[i],cp)<DRAG_PX){setDragging({pid:activeId,idx:i});return;}
      }
      if(ap.closed)return;
      setPieces(p=>p.map(x=>x.id===activeId?{...x,pts:[...x.pts,{...cp}]}:x));
    }
  };
  const onMove=e=>{
    e.preventDefault();
    const{x:sx,y:sy}=evtPos(e);const cp=s2c(sx,sy);
    setHoverPt({...cp});
    if(dragging)setPieces(p=>p.map(x=>{
      if(x.id!==dragging.pid)return x;const pts=[...x.pts];pts[dragging.idx]={...cp};return{...x,pts};
    }));
  };
  const onUp=()=>setDragging(null);
  const onTouchStart=e=>{
    e.preventDefault();
    if(e.touches.length>=2){
      const t0=e.touches[0],t1=e.touches[1];
      touchRef.current={type:'pinch',
        initDist:Geo.dist({x:t0.clientX,y:t0.clientY},{x:t1.clientX,y:t1.clientY}),
        initZoom:zoom,initMidX:(t0.clientX+t1.clientX)/2,initMidY:(t0.clientY+t1.clientY)/2,
        initPanX:panX,initPanY:panY};
    }else{touchRef.current={type:'draw'};onDown(e);}
  };
  const onTouchMove=e=>{
    e.preventDefault();
    if(e.touches.length>=2&&touchRef.current.type==='pinch'){
      const t0=e.touches[0],t1=e.touches[1];
      const nd=Geo.dist({x:t0.clientX,y:t0.clientY},{x:t1.clientX,y:t1.clientY});
      const ts=touchRef.current,nz=Math.max(1,Math.min(6,ts.initZoom*nd/ts.initDist));
      setZoom(nz);setPanX(ts.initPanX+((t0.clientX+t1.clientX)/2-ts.initMidX));setPanY(ts.initPanY+((t0.clientY+t1.clientY)/2-ts.initMidY));
    }else if(touchRef.current.type==='draw')onMove(e);
  };
  const onTouchEnd=e=>{e.preventDefault();if(touchRef.current.type==='draw')onUp();if(e.touches.length<2)touchRef.current={type:null};};

  const undo=()=>{
    if(step===3){calibMode==='line'?setScalePts(p=>p.slice(0,-1)):setHomoPts(p=>p.slice(0,-1));return;}
    if(step===4)setPieces(p=>p.map(x=>{
      if(x.id!==activeId)return x;
      if(x.closed)return{...x,closed:false};
      return{...x,pts:x.pts.slice(0,-1)};
    }));
  };
  const addPiece=()=>{const id=Geo.uid(),n=pieces.length+1;setPieces(p=>[...p,{id,name:`영역 ${n}`,pts:[],closed:false}]);setActiveId(id);};
  const getTiles=piece=>{
    if(!piece.closed||!calib||!piece.pts.length)return null;
    const mp=piece.pts.map(p=>Measure.toMm(p,calib));
    const xs=mp.map(p=>p.x),ys=mp.map(p=>p.y);
    const cols=Math.ceil((Math.max(...xs)-Math.min(...xs))/tileSize);
    const rows=Math.ceil((Math.max(...ys)-Math.min(...ys))/tileSize);
    return{cols,rows,total:cols*rows};
  };
  const exportSVG=()=>{
    const svg=ExportCore.toSVG(pieces,calib);
    if(!svg)return showToast('내보낼 영역이 없어요');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    a.download='cutting-guide.svg';a.click();showToast('SVG 다운로드 완료 ✓');
  };
  const getMeasurements=()=>{
    if(!calib)return[];
    return pieces.map(piece=>{
      const ep=piece.closed?[...piece.pts,piece.pts[0]]:piece.pts;
      const sides=[];
      for(let j=1;j<ep.length;j++){const mm=Measure.mmDist(ep[j-1],ep[j],calib);if(mm!==null)sides.push(mm);}
      return{name:piece.name,sides,areaMm2:piece.closed?(Measure.mmArea(piece.pts,calib)||0):0,closed:piece.closed,piece,fromAI:piece.fromAI};
    });
  };

  const ap=pieces.find(p=>p.id===activeId);
  const hasClosed=pieces.some(p=>p.closed);
  const ms=getMeasurements();

  const StepDot=({n,label})=>(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
      <div style={{width:26,height:26,borderRadius:'50%',
        background:step>n?C.success:step===n?C.accent:C.faint,
        border:step===n?`2px solid ${C.accentTxt}`:'2px solid transparent',
        display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:step>=n?'#fff':C.muted}}>
        {step>n?'✓':n}
      </div>
      <div style={{fontSize:9,color:step===n?C.accentTxt:C.muted}}>{label}</div>
    </div>
  );

  const CanvasArea=()=>(
    <div style={{position:'relative',background:'#000',overflow:'hidden'}}>
      <canvas ref={canvasRef}
        style={{display:'block',width:`${zoom*100}%`,transform:`translate(${panX}px,${panY}px)`,transformOrigin:'top left',touchAction:'none',cursor:'crosshair'}}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}/>
      <div className="no-print" style={{position:'absolute',top:10,right:10,display:'flex',flexDirection:'column',gap:4,zIndex:20}}>
        {[{l:'+',a:()=>setZoom(z=>Math.min(6,+(z+0.5).toFixed(1)))},
          {l:'−',a:()=>setZoom(z=>{const nz=Math.max(1,+(z-0.5).toFixed(1));if(nz===1){setPanX(0);setPanY(0);}return nz;})},
          {l:'↺',a:resetView}].map(({l,a})=>(
          <button key={l} onClick={a} style={{width:40,height:40,borderRadius:10,border:'none',background:'rgba(0,0,0,0.7)',color:'#fff',fontSize:18,cursor:'pointer',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{l}</button>
        ))}
        <div style={{background:'rgba(0,0,0,0.6)',borderRadius:6,padding:'3px 0',fontSize:10,color:'#aaa',textAlign:'center'}}>{Math.round(zoom*100)}%</div>
      </div>
    </div>
  );

  // ─── 관리자 설정 패널 ───────────────────────────────
  const SettingsPanel=()=>{
    const [newPresetLabel,setNewPresetLabel]=useState('');
    const [newPresetValue,setNewPresetValue]=useState('');
    return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.88)',zIndex:300,display:'flex',alignItems:'flex-end'}}
      onClick={e=>{if(e.target===e.currentTarget)setShowSettings(false);}}>
      <div style={{background:C.surf,borderRadius:'20px 20px 0 0',width:'100%',maxWidth:600,margin:'0 auto',maxHeight:'88vh',overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {/* 탭 헤더 */}
        <div style={{padding:'16px 20px 0',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontWeight:800,fontSize:16}}>⚙️ 설정</span>
          <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
            {[{id:'api',label:'API'},
              {id:'admin',label:'👑 관리자'}].map(t=>(
              <button key={t.id} onClick={()=>setSettingsTab(t.id)} style={{padding:'6px 14px',borderRadius:8,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
                background:settingsTab===t.id?C.accent:'transparent',color:settingsTab===t.id?'#fff':C.muted}}>{t.label}</button>
            ))}
          </div>
          <BtnG onClick={()=>setShowSettings(false)} style={{marginLeft:8}}>닫기</BtnG>
        </div>
        <div style={{overflowY:'auto',padding:20,flex:1}}>

        {/* ── API 탭 ── */}
        {settingsTab==='api'&&<div>
          <div style={{marginBottom:16}}>
            <div style={{fontWeight:600,marginBottom:6,fontSize:14}}>Anthropic API 키</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:8}}>AI 자동 감지 기능에 필요합니다</div>
            <input type="password" value={apiKey}
              onChange={e=>{setApiKey(e.target.value);StorageService.save('apiKey',e.target.value);}}
              placeholder="sk-ant-..."
              style={{width:'100%',padding:'12px 14px',borderRadius:10,border:`2px solid ${C.border}`,background:'#242424',color:C.txt,fontSize:14}}/>
            <div style={{fontSize:11,color:C.faint,marginTop:6}}>로컬에만 저장 · 외부 전송 없음</div>
          </div>
          <div style={{background:C.card,borderRadius:12,padding:14,fontSize:12,color:C.muted,lineHeight:1.9}}>
            💡 console.anthropic.com → API Keys 에서 발급<br/>
            ⚠️ AI 감지가 안 될 경우: API 키 확인 및 크레딧 잔액 확인
          </div>
        </div>}

        {/* ── 관리자 탭 ── */}
        {settingsTab==='admin'&&<div style={{display:'grid',gap:16}}>

          {/* 표시 단위 */}
          <div style={{background:C.card,borderRadius:14,padding:16}}>
            <div style={{fontWeight:700,marginBottom:12,fontSize:15}}>📐 표시 단위</div>
            <div style={{display:'flex',gap:8}}>
              {[{v:'mm',label:'mm (밀리미터)'},{v:'cm',label:'cm (센티미터)'}].map(u=>(
                <button key={u.v} onClick={()=>saveAdmin({unit:u.v})} style={{
                  flex:1,padding:'12px',borderRadius:10,cursor:'pointer',fontWeight:700,
                  border:`2px solid ${admin.unit===u.v?C.accent:C.border}`,
                  background:admin.unit===u.v?C.accentDim:C.faint,
                  color:admin.unit===u.v?C.accentTxt:'#888'}}>
                  {u.label}
                </button>
              ))}
            </div>
          </div>

          {/* 기본 타일 크기 */}
          <div style={{background:C.card,borderRadius:14,padding:16}}>
            <div style={{fontWeight:700,marginBottom:12,fontSize:15}}>🧩 기본 타일 크기</div>
            <div style={{display:'flex',gap:8}}>
              {[50,60].map(s=>(
                <button key={s} onClick={()=>{saveAdmin({defaultTileSize:s});setTileSize(s);}} style={{
                  flex:1,padding:'12px',borderRadius:10,cursor:'pointer',fontWeight:700,
                  border:`2px solid ${admin.defaultTileSize===s?C.accent:C.border}`,
                  background:admin.defaultTileSize===s?C.accentDim:C.faint,
                  color:admin.defaultTileSize===s?C.accentTxt:'#888'}}>{s}×{s}mm</button>
              ))}
              <input type="number" placeholder="직접" defaultValue={![50,60].includes(admin.defaultTileSize)?admin.defaultTileSize:''}
                onChange={e=>{if(+e.target.value>0){saveAdmin({defaultTileSize:+e.target.value});setTileSize(+e.target.value);}}}
                style={{flex:1,padding:'12px',borderRadius:10,border:`2px solid ${C.border}`,background:'#2a2a2a',color:C.txt,fontSize:15,textAlign:'center'}}/>
            </div>
          </div>

          {/* 도형 닫기 감도 */}
          <div style={{background:C.card,borderRadius:14,padding:16}}>
            <div style={{fontWeight:700,marginBottom:4,fontSize:15}}>🎯 도형 닫기 감지 거리</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>값이 클수록 첫 점에서 더 멀리서도 닫힘 (기본: 44px)</div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="range" min="20" max="80" value={admin.closeSensitivity||44}
                onChange={e=>saveAdmin({closeSensitivity:+e.target.value})}
                style={{flex:1}}/>
              <span style={{fontSize:16,fontWeight:700,color:C.accentTxt,minWidth:40,textAlign:'center'}}>{admin.closeSensitivity||44}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:C.muted,marginTop:4}}>
              <span>정밀 (20)</span><span>보통 (44)</span><span>여유 (80)</span>
            </div>
          </div>

          {/* 기준선 프리셋 */}
          <div style={{background:C.card,borderRadius:14,padding:16}}>
            <div style={{fontWeight:700,marginBottom:12,fontSize:15}}>📏 기준선 프리셋</div>
            {admin.presets.map((p,i)=>(
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,background:C.faint,borderRadius:8,padding:'8px 10px'}}>
                <input type="text" value={p.label} onChange={e=>{
                  const np=[...admin.presets];np[i]={...np[i],label:e.target.value};saveAdmin({presets:np});
                }} style={{flex:1,background:'transparent',border:'none',color:C.txt,fontSize:14,outline:'none'}}/>
                <input type="number" value={p.value} onChange={e=>{
                  const np=[...admin.presets];np[i]={...np[i],value:+e.target.value};saveAdmin({presets:np});
                }} style={{width:70,background:'#333',border:`1px solid ${C.border}`,borderRadius:6,color:C.txt,fontSize:14,padding:'4px 8px',textAlign:'right'}}/>
                <span style={{color:C.muted,fontSize:12}}>mm</span>
                <button onClick={()=>saveAdmin({presets:admin.presets.filter(x=>x.id!==p.id)})}
                  style={{background:'transparent',border:'none',color:C.danger,fontSize:18,cursor:'pointer',padding:'0 4px'}}>✕</button>
              </div>
            ))}
            <div style={{display:'flex',gap:6,marginTop:10}}>
              <input type="text" value={newPresetLabel} onChange={e=>setNewPresetLabel(e.target.value)}
                placeholder="이름" style={{flex:1,padding:'8px 10px',borderRadius:8,border:`1px solid ${C.border}`,background:'#2a2a2a',color:C.txt,fontSize:13}}/>
              <input type="number" value={newPresetValue} onChange={e=>setNewPresetValue(e.target.value)}
                placeholder="mm" style={{width:70,padding:'8px 10px',borderRadius:8,border:`1px solid ${C.border}`,background:'#2a2a2a',color:C.txt,fontSize:13}}/>
              <button onClick={()=>{
                if(!newPresetLabel||!newPresetValue||+newPresetValue<=0)return;
                saveAdmin({presets:[...admin.presets,{id:Geo.uid(),label:newPresetLabel,value:+newPresetValue}]});
                setNewPresetLabel('');setNewPresetValue('');
              }} style={{padding:'8px 14px',borderRadius:8,border:'none',background:C.accent,color:'#fff',fontSize:13,cursor:'pointer'}}>+ 추가</button>
            </div>
          </div>

          {/* 초기화 */}
          <button onClick={()=>{
            saveAdmin({...DEFAULT_ADMIN});setTileSize(DEFAULT_ADMIN.defaultTileSize);
            showToast('관리자 설정 초기화 완료');
          }} style={{padding:'12px',borderRadius:10,border:`1px solid ${C.danger}44`,background:'transparent',color:C.danger,fontSize:14,cursor:'pointer'}}>
            ↺ 관리자 설정 초기화
          </button>
        </div>}
        </div>
      </div>
    </div>
  );};

  return(
    <div style={{background:C.bg,minHeight:'100vh',maxWidth:600,margin:'0 auto',paddingBottom:110}}>

      {/* 헤더 */}
      <div className="no-print" style={{background:C.surf,padding:'13px 18px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:12,position:'sticky',top:0,zIndex:100}}>
        <span style={{fontSize:22}}>✂️</span>
        <div>
          <div style={{fontWeight:800,fontSize:16}}>매트 컷팅 도구</div>
          <div style={{fontSize:10,color:C.muted}}>v1.3 · 단위: {admin.unit}</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setShowSettings(true)} style={{background:'transparent',border:'none',color:C.muted,fontSize:20,cursor:'pointer',padding:'4px'}}>⚙️</button>
          <div style={{display:'flex',gap:6}}>
            {[['제품',1],['사진',2],['기준',3],['영역',4],['출력',5]].map(([l,n])=><StepDot key={n} n={n} label={l}/>)}
          </div>
        </div>
      </div>

      {toast&&<div style={{position:'fixed',top:70,left:'50%',transform:'translateX(-50%)',background:'#1a1a1a',border:`1px solid ${C.border}`,borderRadius:30,padding:'10px 20px',fontSize:14,zIndex:999,boxShadow:'0 4px 20px #000a',whiteSpace:'nowrap'}}>{toast}</div>}
      {showSettings&&<SettingsPanel/>}

      {/* ══ STEP 1 ══ */}
      {step===1&&<div style={{padding:20}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>제품 타입 선택</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:20}}>시공할 매트 종류를 선택해주세요</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
          {[{id:'puzzle',icon:'🧩',label:'퍼즐형',desc:'조각 타일 조립\n50×50 / 60×60mm'},
            {id:'roll',icon:'📜',label:'롤형',desc:'장판처럼 연속\n롤 시트 방식'}].map(t=>(
            <button key={t.id} onClick={()=>setProdType(t.id)} style={{
              background:prodType===t.id?C.accentDim:C.card,border:`2px solid ${prodType===t.id?C.accent:C.border}`,
              borderRadius:16,padding:'28px 16px',cursor:'pointer',color:C.txt,textAlign:'center'}}>
              <div style={{fontSize:44,marginBottom:10}}>{t.icon}</div>
              <div style={{fontWeight:700,fontSize:17}}>{t.label}</div>
              <div style={{color:C.muted,fontSize:12,marginTop:6,lineHeight:1.6,whiteSpace:'pre-line'}}>{t.desc}</div>
              {prodType===t.id&&<div style={{marginTop:10,fontSize:12,color:C.accentTxt}}>✓ 선택됨</div>}
            </button>
          ))}
        </div>
        {prodType==='puzzle'&&<div style={{background:C.card,borderRadius:14,padding:16,marginBottom:20}}>
          <div style={{fontWeight:600,marginBottom:12,fontSize:14}}>타일 크기 (mm)</div>
          <div style={{display:'flex',gap:8}}>
            {[50,60].map(s=><button key={s} onClick={()=>setTileSize(s)} style={{flex:1,padding:12,borderRadius:10,cursor:'pointer',fontWeight:700,border:`2px solid ${tileSize===s?C.accent:C.border}`,background:tileSize===s?C.accentDim:'#2a2a2a',color:tileSize===s?C.accentTxt:'#888'}}>{s}×{s}</button>)}
            <input type="number" placeholder="직접" value={![50,60].includes(tileSize)?tileSize:''} onChange={e=>setTileSize(+e.target.value||60)}
              style={{flex:1,padding:12,borderRadius:10,border:`2px solid ${C.border}`,background:'#242424',color:C.txt,fontSize:16,textAlign:'center'}}/>
          </div>
        </div>}
        <Btn onClick={()=>setStep(2)}>다음 →</Btn>
      </div>}

      {/* ══ STEP 2 ══ */}
      {step===2&&<div style={{padding:20}}>
        <BtnG onClick={()=>setStep(1)}>← 뒤로</BtnG>
        <h2 style={{fontSize:22,fontWeight:800,margin:'16px 0 6px'}}>현장 사진 업로드</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:24}}>시공 공간 전체가 나오도록 촬영해주세요</p>
        <input type="file" accept="image/*" ref={fileRef} onChange={onFile} style={{display:'none'}}/>
        <div style={{display:'grid',gap:12,marginBottom:20}}>
          <button onClick={()=>{fileRef.current.setAttribute('capture','environment');fileRef.current.click();}}
            style={{padding:20,borderRadius:12,border:'none',background:C.accent,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
            <span style={{fontSize:22}}>📷</span>카메라로 촬영
          </button>
          <button onClick={()=>{fileRef.current.removeAttribute('capture');fileRef.current.click();}}
            style={{background:C.card,border:`2px solid ${C.border}`,borderRadius:12,padding:20,color:'#ccc',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
            <span style={{fontSize:22}}>🖼️</span>갤러리에서 선택
          </button>
        </div>
        <div style={{background:C.card,borderRadius:14,padding:16,fontSize:13,color:C.muted,lineHeight:1.9}}>
          💡 <strong style={{color:'#ccc'}}>4점 원근보정 활용 시 정확도 향상</strong><br/>
          • 문틀(900×2100), 타일(300/600mm) 등 직사각형 물체 포함 촬영<br/>
          • 광각 촬영 시에도 보정 가능
        </div>
      </div>}

      {/* ══ STEP 3 ══ */}
      {step===3&&img&&<div>
        <div className="no-print" style={{padding:'12px 18px',background:C.surf,borderBottom:`1px solid ${C.border}`}}>
          <BtnG onClick={()=>setStep(2)} style={{marginBottom:10}}>← 뒤로</BtnG>
          <div style={{fontWeight:700,fontSize:16,marginBottom:10}}>기준 설정</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
            {[{id:'line',icon:'📏',label:'기준선 방식',sub:'2점 탭 + 길이 입력'},
              {id:'homography',icon:'🔲',label:'4점 원근 보정',sub:'광각 왜곡까지 보정'}].map(m=>(
              <button key={m.id} onClick={()=>{setCalibMode(m.id);setScalePts([]);setHomoPts([]);}}
                style={{padding:'10px 8px',borderRadius:10,cursor:'pointer',textAlign:'center',
                  border:`2px solid ${calibMode===m.id?C.accent:C.border}`,
                  background:calibMode===m.id?C.accentDim:C.card}}>
                <div style={{fontSize:16,marginBottom:2}}>{m.icon}</div>
                <div style={{fontSize:12,fontWeight:700,color:calibMode===m.id?C.accentTxt:C.txt}}>{m.label}</div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>{m.sub}</div>
              </button>
            ))}
          </div>
          <div style={{fontSize:12,color:C.muted}}>
            {calibMode==='line'&&[scalePts.length===0&&'📍 기준이 될 시작점을 탭하세요',scalePts.length===1&&'📍 끝점을 탭하세요',scalePts.length===2&&'📏 아래에 실제 길이를 입력하세요'].find(Boolean)}
            {calibMode==='homography'&&(homoPts.length<4?`📍 ${HOMO_LABELS[homoPts.length]} 코너 탭 (${homoPts.length}/4)`:'📐 아래에 직사각형 실제 크기 입력')}
          </div>
        </div>
        <CanvasArea/>
        <div style={{padding:16}}>
          {calibMode==='line'&&scalePts.length===2&&<div style={{background:C.card,borderRadius:14,border:`2px solid ${C.accent}33`,padding:16,marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:10}}>기준선 실제 길이</div>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
              <input type="number" value={scaleMm} onChange={e=>setScaleMm(e.target.value)} placeholder="mm" autoFocus
                style={{flex:1,padding:'12px 14px',borderRadius:10,border:`2px solid ${C.accent}`,background:'#242424',color:C.txt,fontSize:22,fontWeight:700}}/>
              <span style={{color:C.muted,fontWeight:600}}>mm</span>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {admin.presets.map(p=>(
                <button key={p.id} onClick={()=>setScaleMm(String(p.value))} style={{padding:'8px 14px',borderRadius:8,cursor:'pointer',fontSize:13,
                  border:`1px solid ${scaleMm==p.value?C.accent:C.border}`,background:scaleMm==p.value?C.accentDim:'#2a2a2a',
                  color:scaleMm==p.value?C.accentTxt:C.muted}}>{p.label} {p.value}</button>
              ))}
            </div>
          </div>}
          {calibMode==='line'&&scalePts.length===2&&scaleMm&&+scaleMm>0&&<Btn onClick={confirmLine} style={{marginBottom:8}}>기준 확정 → 영역 설정으로</Btn>}
          {calibMode==='line'&&scalePts.length>0&&<BtnG onClick={()=>setScalePts([])} style={{width:'100%',textAlign:'center'}}>↩ 초기화</BtnG>}

          {calibMode==='homography'&&<div>
            <div style={{background:C.card,borderRadius:14,padding:14,marginBottom:12}}>
              <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>탭 순서 (직사각형 4코너)</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                {HOMO_LABELS.map((l,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,
                    background:i<homoPts.length?`${HOMO_COLORS[i]}18`:C.faint,
                    border:`1px solid ${i<homoPts.length?HOMO_COLORS[i]:i===homoPts.length?C.accent:C.border}`}}>
                    <div style={{width:10,height:10,borderRadius:'50%',background:i<homoPts.length?HOMO_COLORS[i]:i===homoPts.length?C.accent:C.faint}}/>
                    <span style={{fontSize:12,color:i<homoPts.length?'#aaa':i===homoPts.length?C.txt:C.muted}}>{l}</span>
                    {i<homoPts.length&&<span style={{marginLeft:'auto'}}>✅</span>}
                    {i===homoPts.length&&<span style={{marginLeft:'auto',fontSize:11,color:C.accentTxt}}>← 탭</span>}
                  </div>
                ))}
              </div>
            </div>
            {homoPts.length===4&&<div style={{background:C.card,borderRadius:14,border:`2px solid ${C.accent}33`,padding:16,marginBottom:12}}>
              <div style={{fontWeight:600,marginBottom:10}}>직사각형 실제 크기</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                {[{label:'↔ 가로',val:homoW,set:setHomoW,ph:'예: 900'},
                  {label:'↕ 세로',val:homoH,set:setHomoH,ph:'예: 2100'}].map(({label,val,set,ph})=>(
                  <div key={label}>
                    <div style={{fontSize:12,color:C.muted,marginBottom:4}}>{label} (mm)</div>
                    <input type="number" value={val} onChange={e=>set(e.target.value)} placeholder={ph}
                      style={{width:'100%',padding:'12px',borderRadius:10,border:`2px solid ${C.accent}`,background:'#242424',color:C.txt,fontSize:18,fontWeight:700}}/>
                  </div>
                ))}
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
                {[{w:900,h:2100,l:'문 900×2100'},{w:800,h:2000,l:'문 800×2000'},{w:600,h:600,l:'타일 600'},{w:300,h:300,l:'타일 300'}].map(({w,h,l})=>(
                  <button key={l} onClick={()=>{setHomoW(String(w));setHomoH(String(h));}} style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',fontSize:12,
                    border:`1px solid ${homoW==w&&homoH==h?C.accent:C.border}`,background:homoW==w&&homoH==h?C.accentDim:'#2a2a2a',
                    color:homoW==w&&homoH==h?C.accentTxt:C.muted}}>{l}</button>
                ))}
              </div>
              {homoW&&homoH&&+homoW>0&&+homoH>0&&<Btn onClick={confirmHomo}>4점 원근 보정 확정</Btn>}
            </div>}
            {homoPts.length>0&&<BtnG onClick={()=>setHomoPts([])} style={{width:'100%',textAlign:'center'}}>↩ 점 초기화</BtnG>}
          </div>}
        </div>
      </div>}

      {/* ══ STEP 4 ══ */}
      {step===4&&img&&<div>
        <div className="no-print" style={{padding:'10px 18px',background:C.surf,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>컷팅 영역 설정</div>
              {calib&&<span style={{fontSize:10,padding:'2px 8px',borderRadius:10,
                background:calib.mode==='homography'?`${C.warn}22`:`${C.accent}22`,
                color:calib.mode==='homography'?C.warn:C.accentTxt}}>
                {calib.mode==='homography'?'🔲 4점 원근 보정':'📏 기준선 보정'}
              </span>}
            </div>
            <div style={{display:'flex',gap:6}}>
              <BtnG onClick={undo}>↩</BtnG>
              <BtnG onClick={()=>setStep(3)}>기준 재설정</BtnG>
            </div>
          </div>
        </div>
        <div style={{padding:'10px 16px',background:`${C.accent}15`,borderBottom:`1px solid ${C.accent}33`,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:18}}>✨</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:600,color:C.accentTxt}}>AI 자동 감지</div>
            <div style={{fontSize:11,color:C.muted}}>Claude Vision이 영역을 자동 인식</div>
          </div>
          <button onClick={runAIDetect} disabled={aiLoading} style={{padding:'10px 16px',borderRadius:8,border:'none',
            background:aiLoading?C.faint:C.accent,color:'#fff',fontSize:13,fontWeight:700,
            cursor:aiLoading?'default':'pointer',whiteSpace:'nowrap'}}>
            {aiLoading?'분석 중...':'AI 감지'}
          </button>
        </div>
        <CanvasArea/>
        <div style={{padding:16}}>
          <div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontWeight:600}}>컷팅 영역</span>
              <BtnG onClick={addPiece} style={{color:C.accentTxt,border:`1px solid ${C.accent}33`}}>+ 영역 추가</BtnG>
            </div>
            {pieces.map((piece,i)=>(
              <div key={piece.id} onClick={()=>setActiveId(piece.id)} style={{
                display:'flex',alignItems:'center',gap:10,
                background:activeId===piece.id?`${C.accent}12`:'transparent',
                border:`1px solid ${activeId===piece.id?C.accent:C.border}`,
                borderRadius:10,padding:'12px 14px',marginBottom:6,cursor:'pointer'}}>
                <div style={{width:12,height:12,borderRadius:'50%',background:CUT_COLORS[i%CUT_COLORS.length],flexShrink:0}}/>
                <span style={{flex:1,fontSize:14}}>{piece.name}</span>
                {piece.fromAI&&<span style={{fontSize:10,color:C.accentTxt,background:`${C.accent}22`,padding:'2px 6px',borderRadius:4}}>✨AI</span>}
                <span style={{fontSize:12,color:C.muted}}>{piece.closed?'✅':piece.pts.length+'점'}</span>
                <span onClick={e=>{e.stopPropagation();setPieces(p=>p.filter(x=>x.id!==piece.id));}} style={{color:C.faint,padding:'0 6px',fontSize:18,cursor:'pointer'}}>✕</span>
              </div>
            ))}
          </div>
          {ms.some(m=>m.sides.length>0)&&<div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:12}}>📏 실시간 치수 ({admin.unit})</div>
            {ms.map((m,i)=>m.sides.length>0&&<div key={i} style={{marginBottom:14}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                <span style={{fontSize:13,color:CUT_COLORS[i%CUT_COLORS.length],fontWeight:600}}>{m.name}</span>
                {m.fromAI&&<span style={{fontSize:10,color:C.accentTxt}}>✨AI</span>}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                {m.sides.map((s,j)=><div key={j} style={{background:'#2a2a2a',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:C.muted}}>변 {j+1}</div>
                  <div style={{fontWeight:700,fontSize:16}}>{fmtLen(s)}</div>
                </div>)}
                {m.closed&&<div style={{background:`${C.accent}12`,border:`1px solid ${C.accent}33`,borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:C.muted}}>면적</div>
                  <div style={{fontWeight:700,fontSize:16,color:C.accentTxt}}>{fmtArea(m.areaMm2)}</div>
                </div>}
              </div>
              {prodType==='puzzle'&&m.closed&&(()=>{const t=getTiles(m.piece);return t?<div style={{fontSize:12,color:C.muted,marginTop:6}}>타일 {tileSize}mm: 약 <strong style={{color:C.txt}}>{t.total}장</strong> ({t.cols}×{t.rows})</div>:null;})()}
            </div>)}
          </div>}
          <Btn onClick={()=>setStep(5)} style={{background:hasClosed?C.success:'#555',cursor:hasClosed?'pointer':'not-allowed'}} disabled={!hasClosed}>
            {hasClosed?'결과 출력 →':'완성된 영역이 없어요'}
          </Btn>
        </div>
        {ap&&!ap.closed&&ap.pts.length>=3&&<div className="no-print" style={{position:'fixed',bottom:0,left:0,right:0,background:C.surf,borderTop:`1px solid ${C.border}`,padding:'12px 18px',maxWidth:600,margin:'0 auto',zIndex:50}}>
          <div style={{display:'flex',gap:8}}>
            <BtnS onClick={undo} style={{flex:1,padding:'14px'}}>↩ 되돌리기</BtnS>
            <Btn onClick={()=>{setPieces(p=>p.map(x=>x.id===activeId?{...x,closed:true}:x));showToast('✅ 도형 완성!');}} style={{flex:2}}>✅ 도형 완성하기</Btn>
          </div>
        </div>}
      </div>}

      {/* ══ STEP 5 ══ */}
      {step===5&&<div style={{padding:20}}>
        <BtnG className="no-print" onClick={()=>setStep(4)}>← 뒤로</BtnG>
        <h2 style={{fontSize:22,fontWeight:800,margin:'16px 0 6px'}}>컷팅 가이드</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:16}}>치수를 확인하고 파일을 저장하세요</p>
        {calib&&<div style={{background:C.card,borderRadius:10,padding:'10px 14px',marginBottom:16,
          border:`1px solid ${calib.mode==='homography'?C.warn+'44':C.accent+'44'}`,display:'flex',alignItems:'center',gap:8}}>
          <span>{calib.mode==='homography'?'🔲':'📏'}</span>
          <span style={{fontSize:13,color:C.muted}}>{calib.mode==='homography'?'4점 원근 보정 적용 (광각 왜곡 보정)':'기준선 보정 적용'}</span>
        </div>}
        {ms.filter(m=>m.sides.length>0).map((m,i)=>(
          <div key={i} style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              <div style={{width:12,height:12,borderRadius:'50%',background:CUT_COLORS[i%CUT_COLORS.length]}}/>
              <span style={{fontWeight:700,fontSize:16}}>{m.name}</span>
              {m.fromAI&&<span style={{fontSize:11,color:C.accentTxt,background:`${C.accent}22`,padding:'2px 8px',borderRadius:4}}>✨ AI</span>}
              {m.closed&&<span style={{marginLeft:'auto',fontSize:11,color:C.success,background:'#14532d44',padding:'3px 10px',borderRadius:999}}>완성됨</span>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {m.sides.map((s,j)=><div key={j} style={{background:'#2a2a2a',borderRadius:10,padding:14}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:3}}>변 {j+1}</div>
                <div style={{fontWeight:800,fontSize:22}}>{fmtLen(s)}</div>
                <div style={{fontSize:11,color:C.muted}}>{admin.unit==='mm'?`${(s/10).toFixed(1)} cm`:`${Math.round(s)} mm`}</div>
              </div>)}
              {m.closed&&<div style={{background:`${C.accent}12`,border:`1px solid ${C.accent}33`,borderRadius:10,padding:14}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:3}}>면적</div>
                <div style={{fontWeight:800,fontSize:20,color:C.accentTxt}}>{fmtArea(m.areaMm2)}</div>
              </div>}
              {prodType==='puzzle'&&m.closed&&(()=>{const t=getTiles(m.piece);return t?
                <div style={{background:`${C.success}12`,border:`1px solid ${C.success}33`,borderRadius:10,padding:14}}>
                  <div style={{fontSize:11,color:C.muted,marginBottom:3}}>필요 타일 ({tileSize}mm)</div>
                  <div style={{fontWeight:800,fontSize:22,color:C.success}}>{t.total}<span style={{fontSize:13,color:C.muted,marginLeft:2}}>장</span></div>
                  <div style={{fontSize:11,color:C.muted}}>{t.cols}열 × {t.rows}행</div>
                </div>:null;})()}
            </div>
          </div>
        ))}
        <div className="no-print" style={{display:'grid',gap:10,marginTop:8}}>
          <Btn onClick={exportSVG} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span>⬇️</span>SVG 다운로드</Btn>
          <BtnS onClick={()=>window.print()} style={{width:'100%',padding:14,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span>🖨️</span>인쇄</BtnS>
        </div>
        <div style={{background:C.card,borderRadius:14,padding:16,marginTop:16,fontSize:12,color:C.muted,lineHeight:1.9}}>
          📌 SVG는 실제 mm 1:1 비율 · CNC/칼날 커터 직접 사용 가능
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
