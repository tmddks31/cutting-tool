<script type="text/babel">
const {useState,useRef,useEffect,useCallback,useMemo}=React;

// ═══════════════════════════════════════════════════════
// ▓ CORE LAYER ▓  순수 로직 — RN 전환 시 100% 재사용

// ── 에러 코드 시스템 ────────────────────────────────────
// 전체 앱에서 사용하는 표준 에러 코드 정의
// 향후 브랜드 앱 / 고객 지원 / 로그 분석에 활용
const EC={
  DEV:{
    CONN      :'DEV-001', // 기기 연결 실패
    TIMEOUT   :'DEV-002', // 연결 시간 초과
    NO_RESP   :'DEV-003', // 기기 응답 없음
    SEND      :'DEV-004', // G-code 전송 실패
    STOP_FAIL :'DEV-005', // 긴급 정지 실패
    CUT_ERR   :'DEV-006', // 커팅 중 오류
    AUTH      :'DEV-007', // 기기 인증 실패
  },
  OTA:{
    SERVER    :'OTA-001', // 업데이트 서버 연결 실패
    VERSION   :'OTA-002', // 버전 확인 실패
    DOWNLOAD  :'OTA-003', // 펌웨어 다운로드 실패
    CHECKSUM  :'OTA-004', // 파일 검증 실패 (SHA256)
    INSTALL   :'OTA-005', // 설치 실패
    ROLLBACK  :'OTA-006', // 이전 버전으로 자동 롤백됨
  },
  AI:{
    NO_KEY    :'AI-001',  // API 키 없음
    AUTH      :'AI-002',  // API 인증 실패
    IMG       :'AI-003',  // 이미지 처리 실패
    NONE      :'AI-004',  // 감지된 영역 없음
    PARSE     :'AI-005',  // 응답 파싱 실패

  },
  MEAS:{
    NO_CAL    :'MEAS-001',// 보정 정보 없음
    HOMO      :'MEAS-002',// 원근 보정 계산 실패
    NO_AREA   :'MEAS-003',// 완성된 영역 없음
    NO_IMG    :'MEAS-004',// 이미지 없음
  },
  STORE:{
    SAVE      :'STORE-001',// 저장 실패
    LOAD      :'STORE-002',// 불러오기 실패

  },
  BRAND:{
    AUTH      :'BRAND-001',// 브랜드 앱 인증 실패
    INVALID   :'BRAND-002',// 잘못된 실행 파라미터
  },
};

// 에러 메시지 테이블
const EM={
  'DEV-001':'기기 연결 실패','DEV-002':'연결 시간 초과','DEV-003':'기기 응답 없음',
  'DEV-004':'G-code 전송 실패','DEV-005':'긴급 정지 실패','DEV-006':'커팅 중 오류','DEV-007':'기기 인증 실패',
  'OTA-001':'업데이트 서버 연결 실패','OTA-002':'버전 확인 실패','OTA-003':'펌웨어 다운로드 실패',
  'OTA-004':'파일 검증 실패','OTA-005':'설치 실패','OTA-006':'이전 버전으로 롤백됨',
  'AI-001':'API 키가 설정되지 않았습니다','AI-002':'API 인증 실패','AI-003':'이미지 처리 실패',
  'AI-004':'감지된 영역이 없습니다','AI-005':'응답 파싱 실패','AI-006':'오프라인 상태입니다',
  'MEAS-001':'보정 정보가 없습니다','MEAS-002':'원근 보정 계산 실패',
  'MEAS-003':'완성된 영역이 없습니다','MEAS-004':'이미지가 없습니다',
  'STORE-001':'저장 실패','STORE-002':'불러오기 실패','STORE-003':'저장 공간 부족',
  'NET-001':'인터넷 연결 없음','NET-002':'서버 오류','NET-003':'요청 시간 초과',
  'BRAND-001':'브랜드 앱 인증 실패','BRAND-002':'잘못된 실행 파라미터',
};

// 에러 생성 / 포맷 헬퍼
const appErr=(code,detail='')=>{
  const err=new Error(`${EM[code]||code}${detail?` (${detail})`:''}`);
  err.appCode=code;err.userMsg=EM[code]||code;return err;
};
const fmtErr=e=>e.appCode?`${e.userMsg} · ${e.appCode}`:e.message;

// ── 기하 / 측정 / G-code 코어 ────────────────────────────
const Geo={
  dist:(a,b)=>Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2),
  uid:()=>Math.random().toString(36).slice(2,8),
  calcArea:pts=>{if(pts.length<3)return 0;let a=0;for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}return Math.abs(a/2);},
};
const HomographyEngine={
  _solve:(A,b)=>{const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let mx=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[mx][c]))mx=r;[M[c],M[mx]]=[M[mx],M[c]];for(let r=c+1;r<n;r++){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){x[i]=M[i][n];for(let j=i+1;j<n;j++)x[i]-=M[i][j]*x[j];x[i]/=M[i][i];}return x;},
  compute:(src,dst)=>{
    const A=[],b=[];for(let i=0;i<4;i++){const{x:sx,y:sy}=src[i],{x:dx,y:dy}=dst[i];A.push([sx,sy,1,0,0,0,-sx*dx,-sy*dx]);b.push(dx);A.push([0,0,0,sx,sy,1,-sx*dy,-sy*dy]);b.push(dy);}
    try{return[...HomographyEngine._solve(A,b),1];}catch{throw appErr(EC.MEAS.HOMO,'행렬 계산 실패');}
  },
  apply:(H,{x,y})=>{const w=H[6]*x+H[7]*y+H[8];return{x:(H[0]*x+H[1]*y+H[2])/w,y:(H[3]*x+H[4]*y+H[5])/w};},
};
const Measure={
  toMm:(pt,cal)=>{if(!cal)return pt;if(cal.mode==='line')return{x:pt.x*cal.mmPerPx,y:pt.y*cal.mmPerPx};return HomographyEngine.apply(cal.H,pt);},
  mmDist:(a,b,cal)=>cal?Geo.dist(Measure.toMm(a,cal),Measure.toMm(b,cal)):null,
  mmArea:(pts,cal)=>(!cal||pts.length<3)?null:Geo.calcArea(pts.map(p=>Measure.toMm(p,cal))),
};
const GcodeGen={
  generate:(pieces,cal,params)=>{
    if(!cal)throw appErr(EC.MEAS.NO_CAL);
    const closed=pieces.filter(p=>p.closed&&p.pts.length>=3);
    if(!closed.length)throw appErr(EC.MEAS.NO_AREA);
    const allMm=closed.flatMap(p=>p.pts.map(pt=>Measure.toMm(pt,cal)));
    const minX=Math.min(...allMm.map(p=>p.x)),minY=Math.min(...allMm.map(p=>p.y));
    const nx=v=>(v-minX).toFixed(2),ny=v=>(v-minY).toFixed(2),p=params;
    const lines=['; =========================================','; 매트 컷팅 자동 생성 G-code',`; 생성일시: ${new Date().toLocaleString('ko-KR')}`,`; 소재: ${p.material} | 두께: ${p.thickness}mm`,`; 절단 영역: ${closed.length}개`,'; =========================================','G21','G90','G17',`G0 Z${p.liftHeight}.00`,'G0 X0.00 Y0.00',''];
    closed.forEach((piece,i)=>{const pts=piece.pts.map(pt=>Measure.toMm(pt,cal));lines.push(`; ─── ${piece.name} (${i+1}/${closed.length}) ───`);lines.push(`G0 X${nx(pts[0].x)} Y${ny(pts[0].y)}`);lines.push(`G1 Z-${p.cutDepth}.00 F${p.plungeSpeed}`);for(let j=1;j<pts.length;j++)lines.push(`G1 X${nx(pts[j].x)} Y${ny(pts[j].y)} F${p.cutSpeed}`);lines.push(`G1 X${nx(pts[0].x)} Y${ny(pts[0].y)} F${p.cutSpeed}`);lines.push(`G0 Z${p.liftHeight}.00`,'');});
    lines.push('G0 X0.00 Y0.00','M2');return lines.join('\n');
  },
  getMoves:(pieces,cal)=>{if(!cal)return[];const closed=pieces.filter(p=>p.closed&&p.pts.length>=3);if(!closed.length)return[];const allMm=closed.flatMap(p=>p.pts.map(pt=>Measure.toMm(pt,cal)));const minX=Math.min(...allMm.map(p=>p.x)),minY=Math.min(...allMm.map(p=>p.y));const norm=pt=>({x:pt.x-minX,y:pt.y-minY});const moves=[];let cur={x:0,y:0};closed.forEach((piece,pi)=>{const pts=piece.pts.map(pt=>norm(Measure.toMm(pt,cal)));moves.push({type:'travel',from:{...cur},to:{...pts[0]},color:CUT_COLORS[pi%CUT_COLORS.length]});for(let j=1;j<pts.length;j++)moves.push({type:'cut',from:{...pts[j-1]},to:{...pts[j]},color:CUT_COLORS[pi%CUT_COLORS.length]});moves.push({type:'cut',from:{...pts[pts.length-1]},to:{...pts[0]},color:CUT_COLORS[pi%CUT_COLORS.length]});cur={...pts[0]};});moves.push({type:'travel',from:{...cur},to:{x:0,y:0}});return moves;},
  getStats:(moves,params)=>{let tDist=0,cDist=0;moves.forEach(m=>{const d=Geo.dist(m.from,m.to);m.type==='travel'?(tDist+=d):(cDist+=d);});const ts=params.travelSpeed>0?tDist/params.travelSpeed:0,cs=params.cutSpeed>0?cDist/params.cutSpeed:0;return{travelDist:tDist,cutDist:cDist,timeSec:Math.ceil((ts+cs)*60)};},
};
const ExportCore={
  toSVG:(pieces,cal)=>{if(!cal)return null;const all=pieces.flatMap(p=>p.pts.map(pt=>Measure.toMm(pt,cal)));if(!all.length)return null;const pad=15,minX=Math.min(...all.map(p=>p.x))-pad,minY=Math.min(...all.map(p=>p.y))-pad,W=Math.max(...all.map(p=>p.x))+pad-minX,H=Math.max(...all.map(p=>p.y))+pad-minY;let body='';pieces.forEach((piece,pi)=>{if(piece.pts.length<2)return;const color=CUT_COLORS[pi%CUT_COLORS.length],mp=piece.pts.map(pt=>Measure.toMm(pt,cal));body+=`<path d="M ${mp.map(p=>`${(p.x-minX).toFixed(2)},${(p.y-minY).toFixed(2)}`).join(' L ')}${piece.closed?' Z':''}" fill="${piece.closed?color+'22':'none'}" stroke="${color}" stroke-width="0.5"/>\n`;const ep=piece.closed?[...mp,mp[0]]:mp;for(let i=1;i<ep.length;i++){const mm=Geo.dist(ep[i-1],ep[i]);body+=`<text x="${((ep[i-1].x+ep[i].x)/2-minX).toFixed(1)}" y="${((ep[i-1].y+ep[i].y)/2-minY-1.5).toFixed(1)}" font-size="3" fill="${color}" text-anchor="middle">${mm.toFixed(0)}mm</text>\n`;}});return`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(1)}mm" height="${H.toFixed(1)}mm" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}">\n${body}</svg>`;},
};

// ═══════════════════════════════════════════════════════════════════
// ▓ SERVICE LAYER ▓  RN 전환 시 구현체만 교체

// ── 브랜드 앱 연동 서비스 ─────────────────────────────────────────
// 향후 브랜드 앱에서 이 앱 실행 시 URL 파라미터로 제어
//
// 진입 방식 (웹):
//   https://app.domain/?source=brand_app&mode=admin&token=TOKEN&returnUrl=brandapp%3A%2F%2F
//
// 진입 방식 (네이티브, RN 전환 후):
//   matcutter://launch?source=brand_app&mode=admin&token=TOKEN&returnUrl=brandapp%3A%2F%2F
//
// 파라미터:
//   source    = 'brand_app' 고정
//   mode      = 'admin' | 'user'
//   token     = 브랜드 앱 발급 인증 토큰 (JWT 권장)
//   returnUrl = 작업 완료 후 돌아갈 URL (인코딩 필수)
//
// 토큰 검증 (현재: 존재 여부만 확인 / 향후: JWT 서명 검증)
// ─────────────────────────────────────────────────────────────────
const LaunchParams=(()=>{
  const p=new URLSearchParams(window.location.search);
  const source=p.get('source');
  const mode=p.get('mode');
  const token=p.get('token');
  const returnUrl=p.get('returnUrl')?decodeURIComponent(p.get('returnUrl')):null;
  const isBrandApp=source==='brand_app';
  // 토큰 검증: 현재는 존재 여부만 확인, 향후 JWT 서명 검증으로 교체
  const isValidToken=isBrandApp?!!token:true;
  if(isBrandApp&&!isValidToken)console.warn(`[${EC.BRAND.AUTH}] 브랜드 앱 토큰 없음`);
  return{
    isBrandApp,
    isAdmin:isBrandApp&&mode==='admin'&&isValidToken,
    isUser:isBrandApp&&mode==='user'&&isValidToken,
    returnUrl,
    token,
    returnToApp:()=>{if(returnUrl)window.location.href=returnUrl;},
  };
})();

const delay=ms=>new Promise(r=>setTimeout(r,ms));

const StorageService={
  save:(k,v)=>{
    try{localStorage.setItem(k,JSON.stringify(v));return true;}
    catch(e){
      if(e.name==='QuotaExceededError')throw appErr(EC.STORE.FULL);
      throw appErr(EC.STORE.SAVE,e.message);
    }
  },
  load:(k)=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch{throw appErr(EC.STORE.LOAD,k);}},
  safeSave:(k,v)=>{try{StorageService.save(k,v);return true;}catch{return false;}},
  safeLoad:(k,def=null)=>{try{return StorageService.load(k)??def;}catch{return def;}},
};

const ProjectService={
  MAX:20,
  save:(name,data)=>{
    const project={id:Geo.uid(),name:name.trim(),savedAt:new Date().toISOString(),prodType:data.prodType,tileSize:data.tileSize,calibMode:data.calib?.mode||'line',thumbnail:data.thumbnail||null,measurements:data.measurements||[],gcStats:data.gcStats||null};
    const list=ProjectService.loadAll();list.unshift(project);
    StorageService.safeSave('projects',list.slice(0,ProjectService.MAX));
    return project;
  },
  loadAll:()=>StorageService.safeLoad('projects',[]),
  delete:(id)=>StorageService.safeSave('projects',ProjectService.loadAll().filter(p=>p.id!==id)),
};

const DeviceService={
  SIMULATION_MODE:true,
  connect:async(ip)=>{
    if(DeviceService.SIMULATION_MODE){await delay(1200);return{success:true,device:{ip,name:'매트 커터 MK-1 [시뮬]',firmwareVersion:'1.0.0',model:'MC-1000'}};}
    try{const r=await fetch(`http://${ip}/api/info`);if(!r.ok)throw appErr(EC.DEV.CONN,`HTTP ${r.status}`);const d=await r.json();return{success:true,device:d};}
    catch(e){throw e.appCode?e:appErr(EC.DEV.CONN,e.message);}
  },
  sendJob:async(ip,gcode,onProgress)=>{
    if(DeviceService.SIMULATION_MODE){let prog=0;const lines=gcode.split('\n').filter(l=>l.startsWith('G1')).length||20;for(let i=0;i<=100;i+=100/lines){await delay(180);prog=Math.min(100,Math.round(i));onProgress?.({progress:prog,x:+(Math.random()*600).toFixed(1),y:+(Math.random()*400).toFixed(1),status:'cutting'});}onProgress?.({progress:100,x:0,y:0,status:'complete'});return{success:true};}
    try{const r=await fetch(`http://${ip}/api/cut`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gcode})});if(!r.ok)throw appErr(EC.DEV.SEND,`HTTP ${r.status}`);return await r.json();}
    catch(e){throw e.appCode?e:appErr(EC.DEV.SEND,e.message);}
  },
  stop:async(ip)=>{
    if(DeviceService.SIMULATION_MODE){await delay(200);return{success:true};}
    try{const r=await fetch(`http://${ip}/api/stop`,{method:'POST'});if(!r.ok)throw appErr(EC.DEV.STOP_FAIL,`HTTP ${r.status}`);return await r.json();}
    catch(e){throw e.appCode?e:appErr(EC.DEV.STOP_FAIL,e.message);}
  },
  pause:async(ip)=>{
    if(DeviceService.SIMULATION_MODE){await delay(200);return{success:true};}
    try{const r=await fetch(`http://${ip}/api/pause`,{method:'POST'});if(!r.ok)throw appErr(EC.DEV.CONN,`HTTP ${r.status}`);return await r.json();}
    catch(e){throw e.appCode?e:appErr(EC.DEV.CONN,e.message);}
  },
  resume:async(ip)=>{
    if(DeviceService.SIMULATION_MODE){await delay(200);return{success:true};}
    try{const r=await fetch(`http://${ip}/api/resume`,{method:'POST'});if(!r.ok)throw appErr(EC.DEV.CONN,`HTTP ${r.status}`);return await r.json();}
    catch(e){throw e.appCode?e:appErr(EC.DEV.CONN,e.message);}
  },
};

const OTAService={
  UPDATE_SERVER:'https://updates.matcutter.app',
  checkLatest:async()=>{
    if(DeviceService.SIMULATION_MODE){await delay(800);return{latestVersion:'1.1.0',releaseDate:'2025-06-01',notes:'절단 정확도 향상, 속도 최적화, 버그 수정',checksum:'sha256:a3f8c2...',size:524288};}
    if(!navigator.onLine)throw appErr(EC.NET.OFFLINE);

const VisionAIService={

      if(res.status===401)throw appErr(EC.AI.AUTH);
      if(!res.ok){const e=await res.json().catch(()=>({}));throw appErr(EC.AI.IMG,e.error?.message||`HTTP ${res.status}`);}
      const data=await res.json();
      try{const result=JSON.parse((data.content.find(c=>c.type==='text')?.text||'').replace(/```json|```/g,'').trim());if(!result.polygons?.length)throw appErr(EC.AI.NONE);return result;}
      catch(e){if(e.appCode)throw e;throw appErr(EC.AI.PARSE,e.message);}
    }catch(e){throw e.appCode?e:appErr(EC.AI.IMG,e.message);}
  },
};

function GcodePreviewModal({pieces,calib,params,onClose}){
  const cvRef=useRef(null);const rafRef=useRef(null);
  const [progress,setProgress]=useState(0);const [playing,setPlaying]=useState(false);const [speed,setSpeed]=useState(1);
  const moves=useMemo(()=>GcodeGen.getMoves(pieces,calib),[pieces,calib]);
  const stats=useMemo(()=>GcodeGen.getStats(moves,params),[moves,params]);
  const totalDist=useMemo(()=>moves.reduce((s,m)=>s+Geo.dist(m.from,m.to),0),[moves]);
  const fmtTime=s=>{if(s<60)return`${s}초`;return`${Math.floor(s/60)}분 ${s%60}초`;};
  useEffect(()=>{
    const canvas=cvRef.current;if(!canvas||!moves.length)return;
    const allPts=moves.flatMap(m=>[m.from,m.to]);const mnX=Math.min(...allPts.map(p=>p.x)),mnY=Math.min(...allPts.map(p=>p.y)),mxX=Math.max(...allPts.map(p=>p.x)),mxY=Math.max(...allPts.map(p=>p.y));
    const W=canvas.offsetWidth||500,H=canvas.offsetHeight||320;canvas.width=W;canvas.height=H;
    const pad=40,sc=Math.min((W-pad*2)/(mxX-mnX||1),(H-pad*2)/(mxY-mnY||1));const tx=pt=>({x:pad+(pt.x-mnX)*sc,y:pad+(pt.y-mnY)*sc});
    const ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1e1e1e';ctx.lineWidth=0.5;const gS=50;
    for(let x=0;x<=mxX-mnX+gS;x+=gS){const p=tx({x:mnX+x,y:mnY});ctx.beginPath();ctx.moveTo(p.x,pad);ctx.lineTo(p.x,H-pad/2);ctx.stroke();ctx.fillStyle='#333';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(`${x}`,p.x,H-10);}
    for(let y=0;y<=mxY-mnY+gS;y+=gS){const p=tx({x:mnX,y:mnY+y});ctx.beginPath();ctx.moveTo(pad/2,p.y);ctx.lineTo(W-pad/2,p.y);ctx.stroke();ctx.fillStyle='#333';ctx.textAlign='right';ctx.fillText(`${y}`,pad-4,p.y+4);}
    let dSF=progress*totalDist,acc=0,curPos={x:0,y:0};
    for(let i=0;i<moves.length;i++){const m=moves[i];const md=Geo.dist(m.from,m.to);const fd=acc+md<=dSF,pd=acc<dSF&&acc+md>dSF;if(fd||pd){const t=fd?1:(dSF-acc)/md;const ep={x:m.from.x+(m.to.x-m.from.x)*t,y:m.from.y+(m.to.y-m.from.y)*t};const a=tx(m.from),b=tx(ep);ctx.strokeStyle=m.type==='cut'?(m.color||'#ef4444'):'#3b82f666';ctx.lineWidth=m.type==='cut'?2:1;m.type==='cut'?ctx.setLineDash([]):ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);if(!fd){curPos={...ep};break;}curPos={...m.to};acc+=md;}else break;}
    let aF=0;for(const m of moves){const md=Geo.dist(m.from,m.to),ic=m.type==='cut';const dim=()=>{ctx.strokeStyle=ic?'#333':'#222';ctx.lineWidth=ic?1.5:0.5;ic?ctx.setLineDash([]):ctx.setLineDash([4,4]);};if(aF>=dSF){const a=tx(m.from),b=tx(m.to);dim();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}else if(aF<dSF&&aF+md>dSF){const t=(dSF-aF)/md,pf={x:m.from.x+(m.to.x-m.from.x)*t,y:m.from.y+(m.to.y-m.from.y)*t};const a=tx(pf),b=tx(m.to);dim();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}aF+=md;}
    const o=tx({x:0,y:0});ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(o.x,o.y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f59e0b';ctx.font='bold 11px Arial';ctx.textAlign='left';ctx.fillText('원점',o.x+8,o.y+4);
    const cp=tx(curPos);ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(cp.x,cp.y,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#22c55e44';ctx.lineWidth=12;ctx.beginPath();ctx.arc(cp.x,cp.y,7,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#555';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText('(mm)',W/2,H-2);
  },[moves,progress,totalDist]);
  useEffect(()=>{if(playing){let last=null;const spd=0.00015*speed;const tick=ts=>{if(last!=null)setProgress(p=>{const n=p+(ts-last)*spd;if(n>=1){setPlaying(false);return 1;}return n;});last=ts;rafRef.current=requestAnimationFrame(tick);};rafRef.current=requestAnimationFrame(tick);}return()=>cancelAnimationFrame(rafRef.current);},[playing,speed]);
  const pct=Math.round(progress*100);
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.97)',zIndex:400,display:'flex',flexDirection:'column',maxWidth:600,margin:'0 auto'}}>
      <div style={{padding:'12px 16px',background:C.surf,borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:18}}>🎬</span><div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>G-code 경로 시뮬레이터</div><div style={{fontSize:11,color:C.muted}}>소재: {params.material}</div></div><BtnG onClick={onClose}>닫기 ✕</BtnG></div>
      <div style={{flex:1,background:'#0a0a0a'}}><canvas ref={cvRef} style={{width:'100%',height:'100%',display:'block'}}/></div>
      <div style={{padding:14,background:C.surf,borderTop:`1px solid ${C.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><span style={{fontSize:12,color:C.muted,minWidth:30}}>{pct}%</span><div style={{flex:1,background:C.faint,borderRadius:4,height:8,overflow:'hidden',cursor:'pointer'}} onClick={e=>{const r=e.currentTarget.getBoundingClientRect();setProgress(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)));}}><div style={{width:`${pct}%`,height:'100%',background:`linear-gradient(90deg,${C.accent},#22c55e)`,transition:'width 0.1s'}}/></div><span style={{fontSize:12,color:C.muted,minWidth:30,textAlign:'right'}}>100%</span></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>{[{l:'절단 거리',v:`${(stats.cutDist/1000).toFixed(2)}m`,c:C.danger},{l:'이동 거리',v:`${(stats.travelDist/1000).toFixed(2)}m`,c:C.accentTxt},{l:'예상 시간',v:fmtTime(stats.timeSec),c:C.warn}].map(({l,v,c})=>(<div key={l} style={{background:C.card,borderRadius:8,padding:'8px',textAlign:'center'}}><div style={{fontSize:10,color:C.muted,marginBottom:2}}>{l}</div><div style={{fontWeight:700,fontSize:14,color:c}}>{v}</div></div>))}</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}><span style={{fontSize:11,color:C.muted,minWidth:50}}>재생속도</span><input type="range" min="0.5" max="5" step="0.5" value={speed} onChange={e=>setSpeed(+e.target.value)} style={{flex:1}}/><span style={{fontSize:12,color:C.accentTxt,minWidth:30}}>{speed}x</span></div>
        <div style={{display:'flex',gap:8}}><button onClick={()=>{setProgress(0);setPlaying(false);}} style={{padding:'12px 16px',borderRadius:10,border:`1px solid ${C.border}`,background:C.card,color:C.muted,fontSize:18,cursor:'pointer'}}>⏮</button><button onClick={()=>setPlaying(p=>!p)} style={{flex:1,padding:'12px',borderRadius:10,border:'none',background:playing?C.warn:C.accent,color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer'}}>{playing?'⏸ 일시정지':'▶ 재생'}</button><button onClick={()=>{setProgress(1);setPlaying(false);}} style={{padding:'12px 16px',borderRadius:10,border:`1px solid ${C.border}`,background:C.card,color:C.muted,fontSize:18,cursor:'pointer'}}>⏭</button></div>
      </div>
    </div>
  );
}

        {project.gcStats&&<div style={{background:`${C.warn}12`,border:`1px solid ${C.warn}33`,borderRadius:12,padding:14}}><div style={{fontWeight:600,marginBottom:10,color:C.warn}}>⚡ G-code 정보</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>{[{l:'절단 거리',v:`${(project.gcStats.cutDist/1000).toFixed(2)}m`},{l:'이동 거리',v:`${(project.gcStats.travelDist/1000).toFixed(2)}m`},{l:'예상 시간',v:project.gcStats.timeSec<60?`${project.gcStats.timeSec}초`:`${Math.floor(project.gcStats.timeSec/60)}분`}].map(({l,v})=>(<div key={l} style={{background:'rgba(0,0,0,0.3)',borderRadius:8,padding:10,textAlign:'center'}}><div style={{fontSize:10,color:C.muted}}>{l}</div><div style={{fontWeight:700,fontSize:13,color:C.warn}}>{v}</div></div>))}</div></div>}
      </div>

    </div>

}

function App(){

  const screenDist=useCallback((a,b)=>{const c=canvasRef.current;if(!c||!img)return 9999;return Geo.dist(a,b)*(c.getBoundingClientRect().width/img.w);},[img]);
  const evtPos=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};

  const doPushOTA=async()=>{if(!firmwareFile||!deviceInfo)return;setOtaProgress(0);try{await OTAService.pushFirmware(deviceIp,firmwareFile,p=>setOtaProgress(p));showToast('✅ 펌웨어 업로드 완료');setFirmwareFile(null);}catch(e){showToast(fmtErr(e),4000);}finally{setOtaProgress(null);}};

  const onFile=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{imgElRef.current=im;setImg({src:url,w:im.naturalWidth,h:im.naturalHeight});setScalePts([]);setScaleMm('');setHomoPts([]);setHomoW('');setHomoH('');setCalib(null);setPieces([]);setActiveId(null);resetView();setStep(3);};im.src=url;};
  const initPieces=()=>{const id=Geo.uid();setPieces([{id,name:'영역 1',pts:[],closed:false}]);setActiveId(id);};
  const confirmLine=()=>{if(scalePts.length!==2||!scaleMm||+scaleMm<=0)return showToast('끝점과 길이를 모두 입력하세요');setCalib({mode:'line',mmPerPx:+scaleMm/Geo.dist(scalePts[0],scalePts[1])});initPieces();setStep(4);showToast('기준선 설정 완료 ✓');};
  const confirmHomo=()=>{
    if(homoPts.length!==4||!homoW||!homoH||+homoW<=0||+homoH<=0)return showToast('4개 코너와 크기를 모두 입력하세요');
    const W=+homoW,H=+homoH;
    try{setCalib({mode:'homography',H:HomographyEngine.compute(homoPts,[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}])});initPieces();setStep(4);showToast('4점 원근 보정 완료 ✓');}
    catch(e){showToast(fmtErr(e),4000);}
  };
  const runAIDetect=async()=>{
    if(!img||!imgElRef.current)return;setAiLoading(true);
    try{
      const tmp=document.createElement('canvas');tmp.width=img.w;tmp.height=img.h;tmp.getContext('2d').drawImage(imgElRef.current,0,0);

      const np=result.polygons.map((poly,i)=>({id:Geo.uid(),name:poly.name||`AI 영역 ${i+1}`,pts:poly.points.map(p=>({x:p.x*img.w,y:p.y*img.h})),closed:true,fromAI:true}));
      setPieces(p=>[...p.filter(x=>x.pts.length>0),...np]);setActiveId(np[0].id);showToast(`✨ ${np.length}개 영역 감지 완료`);
    }catch(e){showToast(fmtErr(e),4000);}
    finally{setAiLoading(false);}
  };
  const downloadGcode=()=>{try{const gc=GcodeGen.generate(pieces,calib,admin.cutting||DEFAULT_CUTTING);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gc],{type:'text/plain'}));a.download=`cutting_${new Date().toISOString().slice(0,10)}.nc`;a.click();showToast('G-code 다운로드 완료 ✓');}catch(e){showToast(fmtErr(e),4000);}};
  const exportSVG=()=>{const svg=ExportCore.toSVG(pieces,calib);if(!svg)return showToast(EM[EC.MEAS.NO_AREA]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='cutting-guide.svg';a.click();showToast('SVG 다운로드 완료 ✓');};

  const getMeasurements=useCallback(()=>{

  },[calib,pieces]);
  const getTiles=useCallback(piece=>{if(!piece.closed||!calib||!piece.pts.length)return null;const mp=piece.pts.map(p=>Measure.toMm(p,calib));const xs=mp.map(p=>p.x),ys=mp.map(p=>p.y);const cols=Math.ceil((Math.max(...xs)-Math.min(...xs))/tileSize),rows=Math.ceil((Math.max(...ys)-Math.min(...ys))/tileSize);return{cols,rows,total:cols*rows};},[calib,tileSize]);

  const createThumbnail=()=>{const canvas=canvasRef.current;if(!canvas)return null;try{const t=document.createElement('canvas');t.width=280;t.height=160;t.getContext('2d').drawImage(canvas,0,0,280,160);return t.toDataURL('image/jpeg',0.65);}catch{return null;}};
  const doSaveProject=()=>{
    if(!projectName.trim())return showToast('이름을 입력하세요');
    const ms=getMeasurements();
    const measurements=ms.filter(m=>m.closed&&m.sides.length>0).map(m=>({name:m.name,sides:m.sides,areaMm2:m.areaMm2,fromAI:m.fromAI,tiles:prodType==='puzzle'?getTiles(m.piece):null}));
    const gcStats=calib&&pieces.some(p=>p.closed)?GcodeGen.getStats(GcodeGen.getMoves(pieces,calib),admin.cutting||DEFAULT_CUTTING):null;
    try{ProjectService.save(projectName,{prodType,tileSize,calib,measurements,gcStats,thumbnail:createThumbnail()});setProjects(ProjectService.loadAll());setShowSaveDialog(false);setProjectName('');showToast('✅ 프로젝트 저장 완료');}
    catch(e){showToast(fmtErr(e),4000);}
  };
  const deleteProject=(id)=>{ProjectService.delete(id);setProjects(ProjectService.loadAll());showToast('삭제됨');};

  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas||!img||!imgElRef.current)return;
    if(canvas.width!==img.w||canvas.height!==img.h){canvas.width=img.w;canvas.height=img.h;}
    const ctx=canvas.getContext('2d');ctx.clearRect(0,0,img.w,img.h);ctx.drawImage(imgElRef.current,0,0);
    const bs=Math.max(img.w,img.h)*0.014;
    if(step===3&&calibMode==='line'&&scalePts.length>0){const ep=scalePts[1]||hoverPt;ctx.strokeStyle='#60a5fa';ctx.lineWidth=bs*0.4;ctx.setLineDash([bs,bs*0.5]);ctx.beginPath();ctx.moveTo(scalePts[0].x,scalePts[0].y);if(ep)ctx.lineTo(ep.x,ep.y);ctx.stroke();ctx.setLineDash([]);scalePts.forEach(p=>{ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.arc(p.x,p.y,bs*1.2,0,Math.PI*2);ctx.fill();});}
    if(step===3&&calibMode==='homography'){if(homoPts.length>=2){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=bs*0.3;ctx.setLineDash([bs,bs*0.5]);ctx.beginPath();homoPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));if(homoPts.length===4)ctx.closePath();ctx.stroke();ctx.setLineDash([]);}homoPts.forEach((p,i)=>{ctx.fillStyle=HOMO_COLORS[i];ctx.beginPath();ctx.arc(p.x,p.y,bs*1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=`bold ${bs*1.3}px Arial`;ctx.fillText(['TL','TR','BR','BL'][i],p.x+bs*2,p.y-bs*0.5);});if(homoPts.length<4&&hoverPt){ctx.fillStyle=HOMO_COLORS[homoPts.length]+'77';ctx.beginPath();ctx.arc(hoverPt.x,hoverPt.y,bs*1.2,0,Math.PI*2);ctx.fill();}}
    const ap=pieces.find(p=>p.id===activeId);const nearClose=ap&&!ap.closed&&ap.pts.length>=3&&hoverPt&&screenDist(ap.pts[0],hoverPt)<CLOSE_PX;
    pieces.forEach((piece,pi)=>{
      if(!piece.pts.length)return;const color=CUT_COLORS[pi%CUT_COLORS.length],isActive=piece.id===activeId;
      if(piece.closed){ctx.fillStyle=color+'28';ctx.beginPath();piece.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill();}
      ctx.strokeStyle=color;ctx.lineWidth=isActive?bs*0.6:bs*0.3;ctx.lineJoin='round';ctx.beginPath();piece.pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      if(piece.closed)ctx.closePath();else if(isActive&&hoverPt&&step===4){const snap=isActive&&nearClose;ctx.lineTo(snap?piece.pts[0].x:hoverPt.x,snap?piece.pts[0].y:hoverPt.y);}ctx.stroke();
      piece.pts.forEach((p,i)=>{const isFirst=i===0;if(isFirst&&isActive&&nearClose){ctx.strokeStyle='#22c55e';ctx.lineWidth=bs*0.7;ctx.beginPath();ctx.arc(p.x,p.y,bs*2.8,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#22c55e';ctx.font=`bold ${bs*1.4}px Arial`;ctx.textAlign='center';ctx.fillText('탭하면 완성!',p.x,p.y-bs*3.5);ctx.textAlign='left';}ctx.beginPath();ctx.arc(p.x,p.y,isFirst?bs*1.6:bs*1.1,0,Math.PI*2);ctx.fillStyle=isFirst?'#fff':color;ctx.fill();if(isFirst){ctx.strokeStyle=nearClose&&isActive?'#22c55e':color;ctx.lineWidth=bs*0.5;ctx.stroke();}});
      if(calib){ctx.textAlign='center';ctx.font=`bold ${bs*1.5}px Arial`;const ep=piece.closed?[...piece.pts,piece.pts[0]]:piece.pts;for(let i=1;i<ep.length;i++){const mm=Measure.mmDist(ep[i-1],ep[i],calib);if(mm===null)continue;const mx=(ep[i-1].x+ep[i].x)/2,my=(ep[i-1].y+ep[i].y)/2;const txt=fmtLen(mm);const tw=ctx.measureText(txt).width;ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(mx-tw/2-5,my-bs*2,tw+10,bs*2.2);ctx.fillStyle='#fff';ctx.fillText(txt,mx,my-bs*0.3);}ctx.textAlign='left';if(piece.closed){const cx=piece.pts.reduce((s,p)=>s+p.x,0)/piece.pts.length,cy=piece.pts.reduce((s,p)=>s+p.y,0)/piece.pts.length;const a2=Measure.mmArea(piece.pts,calib);if(a2!==null){const txt=fmtArea(a2);ctx.font=`bold ${bs*1.8}px Arial`;ctx.textAlign='center';const tw=ctx.measureText(txt).width;ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(cx-tw/2-8,cy-bs*2.2,tw+16,bs*2.6);ctx.fillStyle=color;ctx.fillText(txt,cx,cy);ctx.textAlign='left';}}}
    });
    if(hoverPt&&(step===3||step===4)&&!nearClose){ctx.fillStyle='rgba(255,255,255,0.45)';ctx.beginPath();ctx.arc(hoverPt.x,hoverPt.y,bs*0.55,0,Math.PI*2);ctx.fill();}
  },[img,scalePts,homoPts,calib,calibMode,pieces,hoverPt,step,activeId,screenDist,fmtLen,fmtArea,CLOSE_PX]);

  const onDown=e=>{e.preventDefault();const{x:sx,y:sy}=evtPos(e);const cp=s2c(sx,sy);if(step===3){calibMode==='line'?scalePts.length<2&&setScalePts(p=>[...p,{...cp}]):homoPts.length<4&&setHomoPts(p=>[...p,{...cp}]);return;}if(step===4){const ap=pieces.find(p=>p.id===activeId);if(!ap)return;if(!ap.closed&&ap.pts.length>=3&&screenDist(ap.pts[0],cp)<CLOSE_PX){setPieces(p=>p.map(x=>x.id===activeId?{...x,closed:true}:x));showToast('✅ 도형 완성!');return;}for(let i=0;i<ap.pts.length;i++)if(screenDist(ap.pts[i],cp)<DRAG_PX){setDragging({pid:activeId,idx:i});return;}if(ap.closed)return;setPieces(p=>p.map(x=>x.id===activeId?{...x,pts:[...x.pts,{...cp}]}:x));}};
  const onMove=e=>{e.preventDefault();const{x:sx,y:sy}=evtPos(e);const cp=s2c(sx,sy);setHoverPt({...cp});if(dragging)setPieces(p=>p.map(x=>{if(x.id!==dragging.pid)return x;const pts=[...x.pts];pts[dragging.idx]={...cp};return{...x,pts};}));};
  const onUp=()=>setDragging(null);

  const onTouchMove=e=>{e.preventDefault();if(e.touches.length>=2&&touchRef.current.type==='pinch'){const t0=e.touches[0],t1=e.touches[1];const ts=touchRef.current;const nz=Math.max(1,Math.min(6,ts.initZoom*Geo.dist({x:t0.clientX,y:t0.clientY},{x:t1.clientX,y:t1.clientY})/ts.initDist));setZoom(nz);setPanX(ts.initPanX+(t0.clientX+t1.clientX)/2-ts.initMidX);setPanY(ts.initPanY+(t0.clientY+t1.clientY)/2-ts.initMidY);}else if(touchRef.current.type==='draw')onMove(e);};

      {showInstallBanner&&!isStandalone&&!isBrandApp&&<div style={{background:`${C.accent}ee`,padding:'12px 18px',display:'flex',alignItems:'center',gap:12}}><span style={{fontSize:20}}>📲</span><div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>앱으로 설치하기</div><div style={{fontSize:11,opacity:0.85}}>홈 화면에 추가하면 앱처럼 사용 가능</div></div><button onClick={handleInstall} style={{padding:'8px 14px',borderRadius:8,border:'none',background:'rgba(255,255,255,0.25)',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>설치</button><button onClick={()=>setShowInstallBanner(false)} style={{background:'transparent',border:'none',color:'rgba(255,255,255,0.7)',fontSize:18,cursor:'pointer',padding:'0 4px'}}>✕</button></div>}

      {toast&&<div style={{position:'fixed',top:70,left:'50%',transform:'translateX(-50%)',background:'#1a1a1a',border:`1px solid ${C.border}`,borderRadius:30,padding:'10px 20px',fontSize:14,zIndex:999,boxShadow:'0 4px 20px #000a',whiteSpace:'nowrap'}}>{toast}</div>}
      {showSettings&&<SettingsPanel/>}
      {showSaveDialog&&<SaveDialog/>}
      {showProjectDetail&&<ProjectDetailModal project={showProjectDetail} onDelete={deleteProject} onClose={()=>setShowProjectDetail(null)}/>}
      {showIosGuide&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:400,display:'flex',alignItems:'flex-end'}} onClick={e=>{if(e.target===e.currentTarget)setShowIosGuide(false);}}><div style={{background:C.surf,borderRadius:'20px 20px 0 0',width:'100%',maxWidth:600,margin:'0 auto',padding:24}}><div style={{fontWeight:800,fontSize:18,marginBottom:16,textAlign:'center'}}>📱 홈 화면에 추가하기</div><div style={{display:'grid',gap:10}}>{[{n:1,icon:'⬆️',t:'Safari 하단 공유 버튼 탭'},{n:2,icon:'📋',t:'"홈 화면에 추가" 선택'},{n:3,icon:'✅',t:'"추가" 버튼 탭 → 설치 완료!'}].map(({n,icon,t})=>(<div key={n} style={{display:'flex',alignItems:'center',gap:14,background:C.card,borderRadius:12,padding:'14px 16px'}}><div style={{width:32,height:32,borderRadius:'50%',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,flexShrink:0}}>{n}</div><span style={{fontSize:20}}>{icon}</span><span style={{fontSize:14}}>{t}</span></div>))}</div><button onClick={()=>setShowIosGuide(false)} style={{width:'100%',marginTop:14,padding:'14px',borderRadius:12,border:'none',background:C.accent,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer'}}>확인</button></div></div>}
      {showGcodePreview&&<GcodePreviewModal pieces={pieces} calib={calib} params={admin.cutting||DEFAULT_CUTTING} onClose={()=>setShowGcodePreview(false)}/>}
      {showCuttingModal&&<CuttingProgressModal deviceInfo={deviceInfo} gcode={cuttingGcode} deviceIp={deviceIp} onClose={()=>setShowCuttingModal(false)}/>}

      {/* STEP 1 */}
      {step===1&&<div style={{padding:20}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>제품 타입 선택</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:20}}>시공할 매트 종류를 선택해주세요</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>{[{id:'puzzle',icon:'🧩',label:'퍼즐형',desc:'조각 타일 조립\n50×50 / 60×60mm'},{id:'roll',icon:'📜',label:'롤형',desc:'장판처럼 연속\n롤 시트 방식'}].map(t=>(<button key={t.id} onClick={()=>setProdType(t.id)} style={{background:prodType===t.id?C.accentDim:C.card,border:`2px solid ${prodType===t.id?C.accent:C.border}`,borderRadius:16,padding:'28px 16px',cursor:'pointer',color:C.txt,textAlign:'center'}}><div style={{fontSize:44,marginBottom:10}}>{t.icon}</div><div style={{fontWeight:700,fontSize:17}}>{t.label}</div><div style={{color:C.muted,fontSize:12,marginTop:6,lineHeight:1.6,whiteSpace:'pre-line'}}>{t.desc}</div>{prodType===t.id&&<div style={{marginTop:10,fontSize:12,color:C.accentTxt,fontWeight:600}}>✓ 선택됨</div>}</button>))}</div>
        {prodType==='puzzle'&&<div style={{background:C.card,borderRadius:14,padding:16,marginBottom:20}}><div style={{fontWeight:600,marginBottom:12,fontSize:14}}>타일 크기 (mm)</div><div style={{display:'flex',gap:8}}>{[50,60].map(s=><button key={s} onClick={()=>setTileSize(s)} style={{flex:1,padding:12,borderRadius:10,cursor:'pointer',fontWeight:700,border:`2px solid ${tileSize===s?C.accent:C.border}`,background:tileSize===s?C.accentDim:'#2a2a2a',color:tileSize===s?C.accentTxt:'#888'}}>{s}×{s}</button>)}<input type="number" placeholder="직접" onChange={e=>setTileSize(+e.target.value||60)} style={{flex:1,padding:12,borderRadius:10,border:`2px solid ${C.border}`,background:'#242424',color:C.txt,fontSize:16,textAlign:'center'}}/></div></div>}
        <Btn onClick={()=>setStep(2)} style={{marginBottom:20}}>다음 →</Btn>
        {projects.length>0&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><span style={{fontWeight:700,fontSize:15}}>📂 저장된 프로젝트</span><span style={{fontSize:12,color:C.muted}}>{projects.length}/{ProjectService.MAX}</span></div>
          <div style={{display:'grid',gap:8}}>{projects.map(p=>(<div key={p.id} onClick={()=>setShowProjectDetail(p)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,cursor:'pointer',display:'flex',gap:12,alignItems:'center'}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accentTxt} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            {p.thumbnail?<img src={p.thumbnail} alt="" style={{width:72,height:44,borderRadius:8,objectFit:'cover',flexShrink:0}}/>:<div style={{width:72,height:44,borderRadius:8,background:C.faint,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>✂️</div>}
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:14,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div><div style={{fontSize:11,color:C.muted}}>{fmtDate(p.savedAt)} · {p.prodType==='puzzle'?'퍼즐형':'롤형'}{p.measurements.length>0&&<span> · {p.measurements.length}개 영역</span>}</div></div>
            <span style={{color:C.muted,fontSize:18}}>›</span>
          </div>))}</div>
        </div>}
      </div>}

      {/* STEP 2 */}
      {step===2&&<div style={{padding:20}}>
        <BtnG onClick={()=>setStep(1)}>← 뒤로</BtnG>
        <h2 style={{fontSize:22,fontWeight:800,margin:'16px 0 6px'}}>현장 사진 업로드</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:24}}>시공 공간 전체가 나오도록 촬영해주세요</p>
        <input type="file" accept="image/*" ref={fileRef} onChange={onFile} style={{display:'none'}}/>
        <div style={{display:'grid',gap:12,marginBottom:20}}>
          <button onClick={()=>{fileRef.current.setAttribute('capture','environment');fileRef.current.click();}} style={{padding:20,borderRadius:12,border:'none',background:C.accent,color:'#fff',fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><span style={{fontSize:22}}>📷</span>카메라로 촬영</button>
          <button onClick={()=>{fileRef.current.removeAttribute('capture');fileRef.current.click();}} style={{background:C.card,border:`2px solid ${C.border}`,borderRadius:12,padding:20,color:'#ccc',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><span style={{fontSize:22}}>🖼️</span>갤러리에서 선택</button>
        </div>
        <div style={{background:C.card,borderRadius:14,padding:16,fontSize:13,color:C.muted,lineHeight:1.9}}>💡 <strong style={{color:'#ccc'}}>4점 원근보정 활용 시 정확도 향상</strong><br/>문틀(900×2100), 타일(300/600mm) 등 직사각형 물체 포함 촬영</div>
      </div>}

      {/* STEP 3 */}
      {step===3&&img&&<div>
        <div className="no-print" style={{padding:'12px 18px',background:C.surf,borderBottom:`1px solid ${C.border}`}}>
          <BtnG onClick={()=>setStep(2)} style={{marginBottom:10}}>← 뒤로</BtnG>
          <div style={{fontWeight:700,fontSize:16,marginBottom:10}}>기준 설정</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>{[{id:'line',icon:'📏',label:'기준선 방식',sub:'2점 탭 + 길이 입력'},{id:'homography',icon:'🔲',label:'4점 원근 보정',sub:'광각 왜곡까지 보정'}].map(m=>(<button key={m.id} onClick={()=>{setCalibMode(m.id);setScalePts([]);setHomoPts([]);}} style={{padding:'10px 8px',borderRadius:10,cursor:'pointer',textAlign:'center',border:`2px solid ${calibMode===m.id?C.accent:C.border}`,background:calibMode===m.id?C.accentDim:C.card}}><div style={{fontSize:16,marginBottom:2}}>{m.icon}</div><div style={{fontSize:12,fontWeight:700,color:calibMode===m.id?C.accentTxt:C.txt}}>{m.label}</div><div style={{fontSize:10,color:C.muted,marginTop:2}}>{m.sub}</div></button>))}</div>
          <div style={{fontSize:12,color:C.muted}}>{calibMode==='line'&&[scalePts.length===0&&'📍 시작점을 탭하세요',scalePts.length===1&&'📍 끝점을 탭하세요',scalePts.length===2&&'📏 실제 길이를 입력하세요'].find(Boolean)}{calibMode==='homography'&&(homoPts.length<4?`📍 ${HOMO_LABELS[homoPts.length]} 코너 탭 (${homoPts.length}/4)`:'📐 직사각형 실제 크기 입력')}</div>
        </div>
        <CanvasArea/>
        <div style={{padding:16}}>
          {calibMode==='line'&&scalePts.length===2&&<div style={{background:C.card,borderRadius:14,border:`2px solid ${C.accent}33`,padding:16,marginBottom:12}}><div style={{fontWeight:600,marginBottom:10}}>기준선 실제 길이</div><div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}><input type="number" value={scaleMm} onChange={e=>setScaleMm(e.target.value)} placeholder="mm" autoFocus style={{flex:1,padding:'12px 14px',borderRadius:10,border:`2px solid ${C.accent}`,background:'#242424',color:C.txt,fontSize:22,fontWeight:700}}/><span style={{color:C.muted,fontWeight:600}}>mm</span></div><div style={{display:'flex',flexWrap:'wrap',gap:6}}>{admin.presets.map(p=><button key={p.id} onClick={()=>setScaleMm(String(p.value))} style={{padding:'8px 14px',borderRadius:8,cursor:'pointer',fontSize:13,border:`1px solid ${scaleMm==p.value?C.accent:C.border}`,background:scaleMm==p.value?C.accentDim:'#2a2a2a',color:scaleMm==p.value?C.accentTxt:C.muted}}>{p.label} {p.value}</button>)}</div></div>}
          {calibMode==='line'&&scalePts.length===2&&scaleMm&&+scaleMm>0&&<Btn onClick={confirmLine} style={{marginBottom:8}}>기준 확정 → 영역 설정으로</Btn>}
          {calibMode==='line'&&scalePts.length>0&&<BtnG onClick={()=>setScalePts([])} style={{width:'100%',textAlign:'center'}}>↩ 초기화</BtnG>}
          {calibMode==='homography'&&<div>
            <div style={{background:C.card,borderRadius:14,padding:14,marginBottom:12}}><div style={{fontWeight:600,marginBottom:10,fontSize:13}}>탭 순서</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>{HOMO_LABELS.map((l,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,background:i<homoPts.length?`${HOMO_COLORS[i]}18`:C.faint,border:`1px solid ${i<homoPts.length?HOMO_COLORS[i]:i===homoPts.length?C.accent:C.border}`}}><div style={{width:10,height:10,borderRadius:'50%',background:i<homoPts.length?HOMO_COLORS[i]:i===homoPts.length?C.accent:C.faint}}/><span style={{fontSize:12,color:i<homoPts.length?'#aaa':i===homoPts.length?C.txt:C.muted}}>{l}</span>{i<homoPts.length&&<span style={{marginLeft:'auto'}}>✅</span>}{i===homoPts.length&&<span style={{marginLeft:'auto',fontSize:11,color:C.accentTxt}}>← 탭</span>}</div>))}</div></div>
            {homoPts.length===4&&<div style={{background:C.card,borderRadius:14,border:`2px solid ${C.accent}33`,padding:16,marginBottom:12}}><div style={{fontWeight:600,marginBottom:10}}>직사각형 실제 크기</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>{[{label:'↔ 가로',val:homoW,set:setHomoW,ph:'예: 900'},{label:'↕ 세로',val:homoH,set:setHomoH,ph:'예: 2100'}].map(({label,val,set,ph})=>(<div key={label}><div style={{fontSize:12,color:C.muted,marginBottom:4}}>{label} (mm)</div><input type="number" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={{width:'100%',padding:'12px',borderRadius:10,border:`2px solid ${C.accent}`,background:'#242424',color:C.txt,fontSize:18,fontWeight:700}}/></div>))}</div><div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>{[{w:900,h:2100,l:'문 900×2100'},{w:800,h:2000,l:'문 800×2000'},{w:600,h:600,l:'타일 600'},{w:300,h:300,l:'타일 300'}].map(({w,h,l})=>(<button key={l} onClick={()=>{setHomoW(String(w));setHomoH(String(h));}} style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',fontSize:12,border:`1px solid ${homoW==w&&homoH==h?C.accent:C.border}`,background:homoW==w&&homoH==h?C.accentDim:'#2a2a2a',color:homoW==w&&homoH==h?C.accentTxt:C.muted}}>{l}</button>))}</div>{homoW&&homoH&&+homoW>0&&+homoH>0&&<Btn onClick={confirmHomo}>4점 원근 보정 확정</Btn>}</div>}
            {homoPts.length>0&&<BtnG onClick={()=>setHomoPts([])} style={{width:'100%',textAlign:'center'}}>↩ 점 초기화</BtnG>}
          </div>}
        </div>
      </div>}

      {/* STEP 4 */}
      {step===4&&img&&<div>
        <div className="no-print" style={{padding:'10px 18px',background:C.surf,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div style={{fontWeight:700,fontSize:15}}>컷팅 영역 설정</div>{calib&&<span style={{fontSize:10,padding:'2px 8px',borderRadius:10,background:calib.mode==='homography'?`${C.warn}22`:`${C.accent}22`,color:calib.mode==='homography'?C.warn:C.accentTxt}}>{calib.mode==='homography'?'🔲 4점 원근 보정':'📏 기준선 보정'}</span>}</div><div style={{display:'flex',gap:6}}><BtnG onClick={undo}>↩</BtnG><BtnG onClick={()=>setStep(3)}>기준 재설정</BtnG></div></div>
        </div>
        <div style={{padding:'10px 16px',background:`${C.accent}15`,borderBottom:`1px solid ${C.accent}33`,display:'flex',alignItems:'center',gap:10}}>
          <span>✨</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:C.accentTxt}}>AI 자동 감지</div><div style={{fontSize:11,color:C.muted}}>Claude Vision이 영역 자동 인식</div></div>
          <button onClick={runAIDetect} disabled={aiLoading||!isOnline} style={{padding:'10px 16px',borderRadius:8,border:'none',background:aiLoading||!isOnline?C.faint:C.accent,color:'#fff',fontSize:13,fontWeight:700,cursor:aiLoading||!isOnline?'default':'pointer',whiteSpace:'nowrap'}}>{aiLoading?'분석 중...':!isOnline?'오프라인':'AI 감지'}</button>
        </div>
        <CanvasArea/>
        <div style={{padding:16}}>
          <div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><span style={{fontWeight:600}}>컷팅 영역</span><BtnG onClick={addPiece} style={{color:C.accentTxt,border:`1px solid ${C.accent}33`}}>+ 영역 추가</BtnG></div>
            {pieces.map((piece,i)=>(<div key={piece.id} onClick={()=>setActiveId(piece.id)} style={{display:'flex',alignItems:'center',gap:10,background:activeId===piece.id?`${C.accent}12`:'transparent',border:`1px solid ${activeId===piece.id?C.accent:C.border}`,borderRadius:10,padding:'12px 14px',marginBottom:6,cursor:'pointer'}}><div style={{width:12,height:12,borderRadius:'50%',background:CUT_COLORS[i%CUT_COLORS.length],flexShrink:0}}/><span style={{flex:1,fontSize:14}}>{piece.name}</span>{piece.fromAI&&<span style={{fontSize:10,color:C.accentTxt,background:`${C.accent}22`,padding:'2px 6px',borderRadius:4}}>✨AI</span>}<span style={{fontSize:12,color:C.muted}}>{piece.closed?'✅':piece.pts.length+'점'}</span><span onClick={e=>{e.stopPropagation();setPieces(p=>p.filter(x=>x.id!==piece.id));}} style={{color:C.faint,padding:'0 6px',fontSize:18,cursor:'pointer'}}>✕</span></div>))}
          </div>
          {ms.some(m=>m.sides.length>0)&&<div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}><div style={{fontWeight:600,marginBottom:12}}>📏 실시간 치수 ({admin.unit})</div>{ms.map((m,i)=>m.sides.length>0&&<div key={i} style={{marginBottom:14}}><div style={{fontSize:13,color:CUT_COLORS[i%CUT_COLORS.length],fontWeight:600,marginBottom:8}}>{m.name}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>{m.sides.map((s,j)=><div key={j} style={{background:'#2a2a2a',borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:10,color:C.muted}}>변 {j+1}</div><div style={{fontWeight:700,fontSize:16}}>{fmtLen(s)}</div></div>)}{m.closed&&<div style={{background:`${C.accent}12`,border:`1px solid ${C.accent}33`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:10,color:C.muted}}>면적</div><div style={{fontWeight:700,fontSize:16,color:C.accentTxt}}>{fmtArea(m.areaMm2)}</div></div>}</div>{prodType==='puzzle'&&m.closed&&(()=>{const t=getTiles(m.piece);return t?<div style={{fontSize:12,color:C.muted,marginTop:6}}>타일 {tileSize}mm: 약 <strong style={{color:C.txt}}>{t.total}장</strong> ({t.cols}×{t.rows})</div>:null;})()}</div>)}</div>}
          <Btn onClick={()=>setStep(5)} style={{background:hasClosed?C.success:'#555',cursor:hasClosed?'pointer':'not-allowed'}} disabled={!hasClosed}>{hasClosed?'결과 출력 →':'완성된 영역이 없어요'}</Btn>
        </div>
        {ap&&!ap.closed&&ap.pts.length>=3&&<div className="no-print" style={{position:'fixed',bottom:0,left:0,right:0,background:C.surf,borderTop:`1px solid ${C.border}`,padding:'12px 18px',maxWidth:600,margin:'0 auto',zIndex:50}}><div style={{display:'flex',gap:8}}><BtnS onClick={undo} style={{flex:1,padding:'14px'}}>↩ 되돌리기</BtnS><Btn onClick={()=>{setPieces(p=>p.map(x=>x.id===activeId?{...x,closed:true}:x));showToast('✅ 도형 완성!');}} style={{flex:2}}>✅ 도형 완성하기</Btn></div></div>}
      </div>}

      {/* STEP 5 */}
      {step===5&&<div style={{padding:20}}>
        <BtnG className="no-print" onClick={()=>setStep(4)}>← 뒤로</BtnG>
        <h2 style={{fontSize:22,fontWeight:800,margin:'16px 0 6px'}}>컷팅 가이드</h2>
        <p style={{color:C.muted,fontSize:14,marginBottom:16}}>치수 확인 후 파일을 저장하세요</p>
        {calib&&<div style={{background:C.card,borderRadius:10,padding:'10px 14px',marginBottom:16,border:`1px solid ${calib.mode==='homography'?C.warn+'44':C.accent+'44'}`,display:'flex',alignItems:'center',gap:8}}><span>{calib.mode==='homography'?'🔲':'📏'}</span><span style={{fontSize:13,color:C.muted}}>{calib.mode==='homography'?'4점 원근 보정 적용':'기준선 보정 적용'}</span></div>}
        {ms.filter(m=>m.sides.length>0).map((m,i)=>(<div key={i} style={{background:C.card,borderRadius:14,padding:16,marginBottom:12}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}><div style={{width:12,height:12,borderRadius:'50%',background:CUT_COLORS[i%CUT_COLORS.length]}}/><span style={{fontWeight:700,fontSize:16}}>{m.name}</span>{m.fromAI&&<span style={{fontSize:11,color:C.accentTxt,background:`${C.accent}22`,padding:'2px 8px',borderRadius:4}}>✨ AI</span>}{m.closed&&<span style={{marginLeft:'auto',fontSize:11,color:C.success,background:'#14532d44',padding:'3px 10px',borderRadius:999}}>완성됨</span>}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>{m.sides.map((s,j)=><div key={j} style={{background:'#2a2a2a',borderRadius:10,padding:14}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>변 {j+1}</div><div style={{fontWeight:800,fontSize:22}}>{fmtLen(s)}</div><div style={{fontSize:11,color:C.muted}}>{admin.unit==='mm'?`${(s/10).toFixed(1)} cm`:`${Math.round(s)} mm`}</div></div>)}{m.closed&&<div style={{background:`${C.accent}12`,border:`1px solid ${C.accent}33`,borderRadius:10,padding:14}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>면적</div><div style={{fontWeight:800,fontSize:20,color:C.accentTxt}}>{fmtArea(m.areaMm2)}</div></div>}{prodType==='puzzle'&&m.closed&&(()=>{const t=getTiles(m.piece);return t?<div style={{background:`${C.success}12`,border:`1px solid ${C.success}33`,borderRadius:10,padding:14}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>필요 타일 ({tileSize}mm)</div><div style={{fontWeight:800,fontSize:22,color:C.success}}>{t.total}<span style={{fontSize:13,color:C.muted,marginLeft:2}}>장</span></div><div style={{fontSize:11,color:C.muted}}>{t.cols}열 × {t.rows}행</div></div>:null;})()}</div></div>))}
        <div className="no-print" style={{display:'grid',gap:10,marginTop:8}}>
          <button onClick={()=>{setProjectName(`현장 ${new Date().toLocaleDateString('ko-KR')}`);setShowSaveDialog(true);}} style={{padding:'14px',borderRadius:12,border:`2px solid ${C.success}`,background:`${C.success}12`,color:C.success,fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><span style={{fontSize:20}}>💾</span>프로젝트 저장</button>
          <Btn onClick={exportSVG} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span>⬇️</span>SVG 다운로드</Btn>
          <div style={{background:`${C.warn}10`,border:`1px solid ${C.warn}33`,borderRadius:14,padding:16}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}><span style={{fontSize:18}}>⚡</span><div style={{flex:1}}><div style={{fontWeight:700,color:C.warn,fontSize:15}}>G-code + 커팅기 제어</div><div style={{fontSize:11,color:C.muted}}>{(admin.cutting||DEFAULT_CUTTING).material} | {(admin.cutting||DEFAULT_CUTTING).cutSpeed}mm/min</div></div><button onClick={()=>{setShowSettings(true);setSettingsTab('cutting');}} style={{padding:'4px 10px',borderRadius:6,border:`1px solid ${C.warn}44`,background:'transparent',color:C.warn,fontSize:11,cursor:'pointer'}}>⚙️</button></div>
            {gcStats&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:12}}>{[{l:'절단 거리',v:`${(gcStats.cutDist/1000).toFixed(2)}m`},{l:'이동 거리',v:`${(gcStats.travelDist/1000).toFixed(2)}m`},{l:'예상 시간',v:gcStats.timeSec<60?`${gcStats.timeSec}초`:`${Math.floor(gcStats.timeSec/60)}분`}].map(({l,v})=>(<div key={l} style={{background:'rgba(0,0,0,0.3)',borderRadius:8,padding:'8px',textAlign:'center'}}><div style={{fontSize:10,color:C.muted}}>{l}</div><div style={{fontWeight:700,fontSize:14,color:C.warn}}>{v}</div></div>))}</div>}
            <div style={{display:'grid',gap:8}}>
              <button onClick={()=>setShowGcodePreview(true)} style={{padding:'12px',borderRadius:10,border:`1px solid ${C.warn}55`,background:`${C.warn}15`,color:C.warn,fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>🎬 커팅 경로 시뮬레이터</button>
              <button onClick={()=>{
                if(!deviceInfo)return showToast('기기를 먼저 연결해주세요');
                try{const gc=GcodeGen.generate(pieces,calib,admin.cutting||DEFAULT_CUTTING);setCuttingGcode(gc||'');setShowCuttingModal(true);}
                catch(e){showToast(fmtErr(e),4000);}
              }} style={{padding:'14px',borderRadius:10,border:'none',background:deviceInfo?C.success:'#333',color:deviceInfo?'#fff':C.muted,fontSize:15,fontWeight:700,cursor:deviceInfo?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><span style={{fontSize:20}}>📡</span>{deviceInfo?`커팅기로 전송 — ${deviceInfo.name}`:'커팅기 미연결 (⚙️에서 연결)'}</button>
              <button onClick={downloadGcode} style={{padding:'12px',borderRadius:10,border:'none',background:C.warn,color:'#000',fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>⬇️ G-code 다운로드 (.nc)</button>
            </div>
          </div>
          <BtnS onClick={()=>window.print()} style={{width:'100%',padding:14,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>🖨️ 인쇄</BtnS>
        </div>
        <div style={{background:C.card,borderRadius:14,padding:16,marginTop:16,fontSize:12,color:C.muted,lineHeight:1.9}}>📌 SVG: mm 1:1 비율 · CNC/칼날 커터 사용 가능<br/>📌 G-code: GRBL/Marlin 호환 커팅기 직접 전송 가능</div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
